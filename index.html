<style>
:root{
  --paper:#F3F5F2; --paper-2:#E8ECE6; --ink:#16202A; --ink-2:#4A5661; --line:#CBD3CC;
  --go:#C8322B; --go-ink:#FFFFFF; --ok:#1F7A4D; --warn:#B7791F; --bad:#B42318; --info:#1D4ED8;
  --card:#FFFFFF; --radius:14px;
  --disp:"Barlow Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{display:flex;flex-direction:column;overflow:hidden}
button{font-family:inherit;font-size:inherit;cursor:pointer}
a{color:var(--info)}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
header .t1{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1}
header .t2{font-size:12px;opacity:.85;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wx{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden;flex:0 0 auto}
.wx button{background:transparent;color:#fff;border:0;padding:6px 10px;font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em}
.wx button.on{background:#fff;color:var(--ink)}
main{flex:1 1 auto;overflow:hidden;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:90px}
.view.on{display:block}
#view-map{padding:0;overflow:hidden}
#map{position:absolute;inset:0}
nav.tabs{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:1000}
nav.tabs button{flex:1;border:0;background:transparent;padding:9px 2px 7px;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.06em;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span.i{font-size:17px}
nav.tabs button.on{color:var(--go)}
.pad{padding:12px 14px}
h2.sec{font-family:var(--disp);font-weight:700;font-size:26px;letter-spacing:.03em;margin:8px 0 10px;line-height:1}
h3{font-family:var(--disp);font-weight:600;font-size:19px;margin:14px 0 6px;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:0 0 10px}
.muted{color:var(--ink-2);font-size:13px}
.tag{display:inline-block;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.06em;padding:2px 7px;border-radius:6px;background:var(--paper-2);color:var(--ink-2);margin-right:4px;vertical-align:middle}
.tag.must{background:#FDE8E7;color:var(--go)} .tag.opt{background:#EEF2FF;color:var(--info)} .tag.wx{background:#FFF4E0;color:var(--warn)}
.tag.ok{background:#E3F4EA;color:var(--ok)} .tag.bad{background:#FDE8E7;color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 12px;font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:.04em;text-decoration:none;min-height:44px}
.btn.go{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.btn.big{width:100%;font-size:19px;min-height:54px}
.btn.sm{padding:7px 10px;min-height:36px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row .btn{flex:1 1 auto}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin-top:8px}

.tl{list-style:none;margin:0;padding:0 0 0 0;position:relative}

  prague_castle: { text:"Пражский Град стоит на холме над Влтавой с IX века, когда князья Пржемысловичи поставили здесь первую крепость. За тысячу лет он был резиденцией чешских королей, императоров Священной Римской империи (Карл IV сделал Прагу столицей империи в XIV веке), а сегодня — президента Чехии. Собор св. Вита строили с 1344 по 1929 год — почти шесть столетий, поэтому готический хор и неоготический западный фасад разделяют полтысячелетия. В соборе — гробница св. Вацлава, покровителя Чехии, и витраж Альфонса Мухи (1931), самый фотографируемый в здании.",

  stechelberg: { text:"Конец дороги в долине; отсюда только канатка на Mürren и Schilthorn (2 970 м, ресторан Piz Gloria из бондианы) или тропы. Водопад Mürrenbachfall (417 м) на стене над станцией — самый высокий в Швейцарии.",
    facts:["Дальше в долине — деревня Trachsellauenen и тропы в Национальный парк без дорог."] },
  grindelwald: { text:"Деревня под северной стеной Эйгера (1 800 м отвесной скалы), которую в 1938 году впервые прошли Хекмайр и Хартер после серии трагедий — «стена смерти» альпинизма. Grindelwald — старейший туристический курорт Оберланда (с 1860-х), отсюда в 1912 году пустили железную дорогу на Jungfraujoch, до сих пор самую высокую в Европе.",
    facts:["С Terrassenweg над деревней — вид на стену Эйгера целиком, бесплатно.","Ледник Untere Grindelwaldgletscher когда-то спускался почти до деревни."] },
  first: { text:"First (2 168 м) — плато над Grindelwald, куда гондола поднимает за 25 минут. Cliff Walk (2015) — металлическая тропа, вынесенная за край скалы, с видом на Eiger, Wetterhorn и Schreckhorn. Озеро Bachalpsee (2 265 м) в часе ходьбы — самое фотографируемое отражение Бернских Альп; вода ледниковая, зеркало бывает только в безветрие.",
    facts:["Наверху можно спуститься на самокатах (Trottibike) или на летних санях — по желанию."] },
  interlaken: { text:"«Между озёрами» — курортный город XIX века между Thunersee и Brienzersee, бывший монастырский посёлок. Brienzersee — самое чистое крупное озеро Швейцарии, бирюзовое от ледниковой взвеси; Iseltwald на южном берегу — рыбацкая деревня, ставшая знаменитой после корейского сериала «Аварийная посадка любви» (2019).",
    facts:["С луга Höhematte в Интерлакене виден Jungfrau целиком."] },
  bgo_airport: { text:"Bergen Flesland — второй аэропорт Норвегии, в 18 км от города. Берген был столицей Норвегии в XIII веке и главной конторой Ганзейского союза; сегодня это нефтяная столица и ворота к фьордам. И самый дождливый большой город Европы — 240 дней осадков в году: зонт в багаже не лишний.", facts:[] },
  steinsdalsfossen: { text:"Водопад высотой 50 м на реке Fosselva; тропа проходит за струёй по сухой нише — можно пройти, не промокнув. Отсюда начинался «водопадный туризм» Норвегии: кайзер Вильгельм II приезжал сюда ежегодно с 1889 по 1914 год, и это принесло Хардангеру первые пароходы и отели. Стеклянная кабинка на камне и тропа — реконструкция 2010-х.",
    facts:["Раньше водопад звали Øvsthusfossen — по имени хутора; Steinsdal — название долины."] },
  hardanger_bridge: { text:"Hardangerbrua (2013) — подвесной мост длиной 1 380 м с главным пролётом 1 310 м, один из десяти длиннейших в мире; пилоны 200 м. Он заменил паром Bruravik–Brimnes и связал Бергенский регион с Хардангервиддой. Хардангерфьорд — второй по длине в Норвегии (179 км), «фруктовый сад Норвегии»: яблоки и вишни на склонах с XIII века, когда их привезли монахи.",
    facts:["Оплата через AutoPASS, ~NOK 140 для легковой — точно уточнить."] },
  voringsfossen: { text:"Vøringsfossen падает на 182 м (свободное падение 145 м) в каньон Måbødalen с края плато Хардангервидда — самого большого горного плато Европы. Водопад открыли для туризма в 1821 году, а дорога через каньон (спиральные тоннели Rv7) — инженерное чудо 1980-х. В 2020 году над пропастью перекинули 47-метровый ступенчатый мост, который стал главным «инстаграмом» Норвегии.",
    facts:["Отель Fossli (1891) на краю — здесь Григ написал часть «Лирических пьес».","Смотровые круглосуточно; мост закрывают при обледенении."] },
  voss: { text:"Voss — посёлок между Бергеном и Согне-фьордом, «экстрим-столица» Норвегии (параплан, рафтинг) и родина олимпийских чемпионов. Деревянная церковь 1277 года пережила бомбардировку 1940 года, уничтожившую центр. Здесь родился Кнут Рокне — легенда американского футбола.",
    facts:["Последний большой супермаркет и АЗС перед Aurland."] },
  aurland_hotel: { text:"Aurlandsvangen — посёлок XVII века на Аурландсфьорде, ветви Согне-фьорда, самого длинного в Норвегии (205 км) и второго в мире. До 1980-х сюда не было дороги — только море и горные тропы; сейчас через Aurland проходит E16 Осло–Берген. Из Aurland родом норвежские «аурландские» кожаные туфли — прообраз американских penny loafers: местные сапожники в 1930-х скопировали мокасины индейцев.",
    facts:["Aurlandsfjord — 29 км, глубина до 960 м при ширине 2 км.","Рядом Undredal — деревня с 100 жителями и 500 козами, козий сыр."] },
  stegastein: { text:"Смотровая Stegastein (2006, архитекторы Todd Saunders и Tommie Wilhelmsen) — 30-метровая ламинированная сосновая консоль, вынесенная на 650 м над Аурландсфьордом; на конце — только стекло. Один из первых и самых известных объектов программы «Национальные туристические дороги» Норвегии, которая с 1990-х ставит архитектуру на обочинах.",
    facts:["Дорога до Stegastein открыта круглый год, дальше — только летом."] },
  aurlandsfjellet: { text:"Fv 5627 — 47 км между Aurland и Lærdal через плато на 1 306 м, построена в 1967 году как единственная связь между фьордами до тоннеля 2000 года. Снег у дороги лежит до июля, отсюда имя «Снежная дорога» (Snøvegen). На плато нет ни одного дома; пейзаж — голые скалы, озёра и мох. Vedahaugane — площадка с бетонным «тоннелем времени» и скульптурой медведя в стекле (2012).",
    facts:["Один из 18 Национальных туристических маршрутов Норвегии.","Открыта примерно с 1 июня до середины октября; закрывают при первом снегопаде."] },
  laerdal: { text:"Lærdalsøyri — торговый посёлок в устье реки Lærdal, «лососевой реки королей»: сюда приезжали британские лорды в XIX веке, отсюда идёт Королевская дорога через горы в Осло (XVII век). 170 деревянных домов XVIII–XIX веков — один из лучших сохранившихся деревянных городков Норвегии. В 2014 году пожар уничтожил 40 домов; старый центр уцелел.",
    facts:["Норвежский центр дикого лосося — аквариум с лососем в реке.","Borgund stavkirke (1180) — самая известная ставкирка Норвегии, 30 км дальше по E16 (не в плане, +1,5 ч)."] },
  laerdal_tunnel: { text:"Lærdalstunnelen (2000) — самый длинный автодорожный тоннель в мире: 24,5 км за 20 минут. Чтобы водители не засыпали, через каждые 6 км устроены три пещеры с голубой и жёлтой подсветкой, имитирующей рассвет; там можно развернуться, но не останавливаться. Тоннель сделал E16 Осло–Берген круглогодичной. Реконструкция 2025–2028: ночные закрытия, о чём знает не каждый навигатор.",
    facts:["Вентиляция — отдельная шахта и электростатические фильтры; воздух меняется каждые 15 минут."] },
  gudvangen: { text:"Gudvangen — «долина богов» в конце Nærøyfjord: фьорд длиной 17 км и шириной местами 250 м между стенами до 1 700 м, самый узкий из больших фьордов Европы и объект ЮНЕСКО с 2005 года (вместе с Geirangerfjord). Отсюда с 1880-х отправлялись первые туристические пароходы; здесь же проходил древний путь викингов вглубь страны.",
    facts:["Водопады Kjelfossen (755 м, один из высочайших в Европе) видны с парковки.","Лодка до Flåm — 2 ч; мы заменяем её дорогой в Bakka."] },
  bakka: { text:"Bakka — хутор из десятка домов и белой церкви 1859 года на западном берегу Nærøyfjord. Единственное место, куда можно доехать вдоль фьорда: дорога кончается здесь, дальше — только на лодке. До 1950-х дети из Bakka ходили в школу в Gudvangen по тропе над водой.",
    facts:["С берега у церкви фьорд виден на всю глубину до поворота у Undredal."] },
  viking_valley: { text:"Njardarheimr (2017) — не музей, а построенная по археологическим данным деревня, где живут и работают «викинги»: кузнец, кожевник, ткачи, повар. Gudvangen выбран не случайно: с 1990-х здесь проходит крупнейший в Норвегии викингский рынок, а долина в эпоху викингов (800–1050) была торговым узлом между морем и горами. Экскурсия объясняет быт, верования, торговлю и почему викинги были не только налётчиками.",
    facts:["Метание топоров и стрельба из лука включены.","Названо в честь Ньёрда — бога моря и торговли."] },
  bryggen: { text:"Bryggen — Немецкая пристань: ряд деревянных контор Ганзы, торговавшей здесь сушёной треской с 1360 по 1754 год. Дома горели и отстраивались в том же виде — нынешние в основном после пожара 1702 года. Фуникулёр Fløibanen (1918) поднимает на Fløyen (320 м) за 8 минут — панорама города и семи гор.",
    facts:["Рыбный рынок Fisketorget — с 1200-х годов.","Берген был столицей Норвегии до 1299 года."] },
  _budapest_hotel_unused: { text:"Будапешт — два города, объединённых в 1873 году: холмистая Буда с замком и равнинный Пешт с парламентом. Цепной мост (1849) — первый постоянный мост через Дунай в Венгрии, Парламент (1904) — третий по величине в мире, Рыбацкий бастион (1902) — неороманская терраса с лучшим видом на Пешт. Набережная в ЮНЕСКО с 1987 года.",
    facts:["Вечерняя подсветка парламента лучше всего видна с Будайской набережной у Batthyány tér.","Термальные купальни — Széchenyi и Gellért — если рейс 22-го дневной."] },
  vienna_hotel: { text:"Wien Hauptbahnhof открыт в 2014 году и заменил два старых вокзала; отсюда Railjet идёт в Будапешт, Прагу, Мюнхен и Цюрих. Район Favoriten — рабочий, спокойный, с быстрым метро в центр.", facts:[] },
  vienna_centre: { text:"Вена — столица Габсбургов 640 лет, до 1918 года — центр империи в 50 миллионов человек. Собор св. Стефана (Stephansdom) строили с 1137 по 1511 год; южная башня 136 м, крыша из 230 000 глазурованных черепиц с двуглавым орлом. Graben — бывший ров римского лагеря Виндобона, сегодня главная торговая улица с Чумной колонной 1693 года. Hofburg — резиденция императоров с 2 600 комнатами, ныне — президента Австрии.", facts:["Кофейни Вены — в списке нематериального наследия ЮНЕСКО.","Figlmüller делает шницель размером с тарелку с 1905 года.","Ринг — бульвар на месте крепостных стен, снесённых в 1857 году."] },
  bergen_hotel: { text:"Берген — Немецкая пристань Bryggen, рыбный рынок и Fløibanen — всё в 5 минутах пешком от центра. Ночь здесь вместо аэропорта даёт вечер и утро на набережной.", facts:["Bryggen — ЮНЕСКО с 1979 года.","Fløibanen (1918) — 8 минут до Fløyen, 320 м, вид на город и семь гор."] },
  meiringen_hotel: { text:"Майринген — главный посёлок долины Хаслиталь, узел старых перевальных путей: отсюда дороги уходят на Гримзель, Сустен и Брюниг. В 1891 году городок почти полностью сгорел и был отстроен заново, поэтому центр выглядит моложе своих лет. Две вещи сделали его известным: Рейхенбахский водопад, где Конан Дойл убил Шерлока Холмса, и безе — по местной легенде, кондитер Гаспарини изобрёл его здесь в XVIII веке, отчего французское meringue и созвучно названию городка.",
    facts:["Гостевая карта Haslital при ночёвке даёт скидки и бесплатный подъёмник — спросить у отеля.","Отсюда 50 минут до Лаутербруннена и 2 часа до Цюриха."] },
  reichenbach: { text:"Водопад Райхенбах падает на 250 метров семью ступенями; верхняя, к которой поднимает фуникулёр, — самая мощная. Конан Дойл увидел его в 1893 году во время швейцарской поездки и написал «Последнее дело Холмса», где сыщик и профессор Мориарти гибнут здесь в схватке. Публика не простила: люди носили траурные повязки, редакцию Strand завалили письмами, тысячи читателей отменили подписку. В 1901 году автор сдался и вернул героя в «Собаке Баскервилей», а гибель объяснил инсценировкой. Фуникулёр Reichenbachfall-Bahn работает с 1899 года и до сих пор возит красные деревянные вагончики.",
    facts:["На скале у верхней площадки — белая звезда, отмечающая место поединка.","Общество Шерлока Холмса ежегодно проводит здесь реконструкцию схватки.","Вниз можно спуститься пешком по тропе за 25 минут."] },
  aare_gorge: { text:"Ааре пропилила в известняковом хребте щель длиной 1,4 км и глубиной до 200 метров при ширине местами полтора метра. Ущелье открыли для публики в 1889 году, проложив деревянные галереи по стене; в первые годы сюда приходили в котелках и с зонтами, а вход стоил 1 франк. Галереи с тех пор перестроены в бетон и сталь, но маршрут тот же. В самом узком месте небо превращается в полоску, а вода внизу идёт со скоростью, которую слышно сквозь скалу.",
    facts:["Внутри прохладно и сыро в любую погоду — куртка не лишняя.","Работает и в дождь: это лучший «дождевой» объект долины."] },
  sherlock_museum: { text:"Музей открыт в 1991 году к столетию первой публикации рассказов, в подвале бывшей английской церкви Святого Михаила — её построили в 1890-х для британских туристов, которых в Майрингене было столько, что понадобился свой храм. Внутри — точная реконструкция гостиной на Бейкер-стрит 221Б: Общество Шерлока Холмса собрало её по описаниям из рассказов, вплоть до персидской туфли с табаком и следов от пуль на стене. На площади перед церковью сидит бронзовый Холмс работы Джона Даблдэя, а сама площадь носит имя Конан Дойла.",
    facts:["В брусчатке у памятника зашифрованы символы из рассказов.","Аудиогид на английском входит в билет."] },
  zrh_hotel: { text:"Ночь у терминала перед утренним рейсом. Отели в комплексе The Circle и Radisson Blu соединены с терминалом крытыми переходами — шаттл не нужен, до стойки регистрации 5–7 минут пешком.", facts:[] },
  maennlichen: { text:"Männlichen — гребень между долинами Лаутербруннен и Гриндельвальд, 2 227 метров. Канатка сюда идёт с 1978 года, а с 2019-го из Гриндельвальда работает V-Bahn — одна из самых современных в Альпах. От верхней станции десять минут по ровной грунтовой дороге (Royal Walk) до вершинного креста, откуда Эйгер, Мёнх и Юнгфрау стоят в ряд напротив, а под ногами обе долины сразу.",
    facts:["Название — «маленький человек», по силуэту скалы.","Отсюда начинается классическая тропа к Kleine Scheidegg, 1 ч 20 под стеной Эйгера."] },
  lauterbrunnen: { text:"Долина Лаутербруннен — классический ледниковый трог: плоское дно, вертикальные стены 400–500 метров и 72 водопада. Гёте приехал сюда в 1779 году и написал под Штауббахом «Песнь духов над водами»; Байрон был в сентябре 1816-го и вставил долину в «Манфреда»; Толкин прошёл её пешком в 1911 году, и в его письмах прямо сказано, что Ривенделл вырос из этих впечатлений. Название значит «только источники» — по числу водопадов.",
    facts:["Деревни Венген и Мюррен на полках над долиной — без автомобилей с XIX века.","Из Штехельберга канатка идёт на Шильтхорн: ресторан Piz Gloria снимался в бондиане 1969 года."] },
  flam_activity: { text:"Флом — деревня в конце Аурландсфьорда, куда с 1940 года идёт Flåmsbana: двадцать километров, 866 метров набора, уклон до 5,5% без зубчатой рейки — одна из самых крутых адгезионных железных дорог мира. Поезд останавливается у водопада Kjosfossen, где летом на скале появляется фигура хюльдры. Отсюда же уходят катамараны по Нэрёйфьорду — с 2018 года электрические, бесшумные: фьорд шириной 250 метров между стенами 1 700 внесён в ЮНЕСКО в 2005 году вместе с Гейрангером.",
    facts:["Строили дорогу двадцать лет, 18 из 20 тоннелей пробиты вручную.","Пивоварня Ægir у станции — зал в форме ставкирки."] },
  hallein: { text:"Соль в Бад-Дюррнберге добывают с эпохи кельтов — раскопки дали могильник железного века и хорошо сохранившиеся тела шахтёров, законсервированные солью. Шахта работала до 1989 года, а как туристический объект существует с XVII века: первых посетителей водили ещё князья-архиепископы, чтобы показать источник своего богатства. Именно соль сделала Зальцбург независимым церковным княжеством: пошлины с неё кормили город восемьсот лет.",
    facts:["Деревянные горки — настоящие: по ним горняки спускались между горизонтами, чтобы не терять время на лестницах.","Подземное соляное озеро использовалось для выщелачивания соли из породы.","Граница Австрии и Германии проходит прямо в штольне — под землёй вы пересекаете её."] },
  innsbruck_hotel2: { text:"Инсбрук — «мост через Инн», город на пути через Бреннер, самый низкий перевал Альп, по которому шли римляне, паломники, армии и купцы. Максимилиан I сделал его резиденцией около 1500 года. Дважды принимал зимнюю Олимпиаду (1964, 1976) и остаётся единственным крупным городом, где горнолыжный склон виден с главной улицы.", facts:["Пёстрые дома на набережной Mariahilf — самый узнаваемый кадр города, снимать с моста Иннбрюкке."] },
  ambras: { text:"Эрцгерцог Фердинанд II (1529–1595) получил Тироль в 1563 году и перестроил средневековую крепость в ренессансный дворец для себя и Филиппины Вельзер, дочери аугсбургского банкира: брак был морганатическим, и жить с ней в столице он не мог. Фердинанд собирал вещи системно и построил для коллекции отдельное здание — это считается первым музейным зданием Европы. Кунсткамера цела и стоит на своих местах с XVI века, что для собраний той эпохи большая редкость: почти все остальные разошлись по музеям.",
    facts:["Портрет Влада Цепеша отсюда — источник всех позднейших изображений Дракулы.","Грегор Бакси написан при жизни с обломком копья, прошедшего голову насквозь; он прожил ещё год.","Семья Гонсалвус с гипертрихозом — вероятный прообраз «Красавицы и чудовища».","В кунсткамере есть предметы из рога нарвала, который продавали как рог единорога вдесятеро дороже золота.","Купальня Филиппины Вельзер в подвале — редчайшая сохранившаяся ренессансная ванная комната."] },
  hofkirche: { text:"Церковь построена в 1553–1563 годах специально для гробницы Максимилиана I. Вокруг кенотафа стоят 28 бронзовых фигур больше человеческого роста — «чёрные люди»: реальные предки Габсбургов вперемешку с легендарными героями, включая короля Артура и Теодориха Великого. Императора здесь нет: он завещал похоронить себя в Винер-Нойштадте, а грандиозный замысел с сорока фигурами и сотней статуэток так и не был завершён — денег не хватило, работы тянулись полвека после его смерти.",
    facts:["Короля Артура отливали по рисунку Дюрера; сапог отполирован прикосновениями.","Рядом — Серебряная капелла и могила Андреаса Хофера, вождя тирольского восстания 1809 года."] },
  goldenes_dachl: { text:"Эркер с 2 657 позолоченными медными черепицами Максимилиан I пристроил в 1500 году к резиденции, чтобы наблюдать турниры и представления на площади. На рельефах балкона — сам император между двумя жёнами: Марией Бургундской, брак с которой принёс ему Нидерланды, и Бьянкой Марией Сфорца, чьё приданое оплатило его войны. По бокам — морисковые танцоры, модное придворное развлечение того времени.",
    facts:["Хельблингхаус напротив — готический дом XV века, на который в 1730 году налепили рококо-лепнину.","Триумфальная арка на Мария-Терезиен-штрассе: южная сторона праздничная, северная траурная — во время свадебных торжеств 1765 года умер муж Марии Терезии."] },
  feldkirch_hotel: { text:"Фельдкирх основан графами Монфор около 1200 года и сохранил средневековую планировку: аркадные улицы Marktgasse, городские ворота и башню Кацентурм с колоколом весом 8,5 тонны. Над городом — замок Шаттенбург. Здесь учился Артур Конан Дойл: он провёл год в иезуитской школе Stella Matutina в 1875–76 годах — совпадение, учитывая, куда вы едете послезавтра.", facts:["Через Фельдкирх проходит граница с Лихтенштейном — до Вадуца 20 минут."] },
  schattenburg: { text:"Крепость графов Монфор, около 1200 года, одна из наиболее сохранившихся в регионе. После продажи Габсбургам служила резиденцией фогта, потом казармой и богадельней; с 1917 года — музей. Внутри жилые интерьеры, кухня, оружие и часовня.", facts:["Во дворе работает ресторан — ужин с видом на город."] },
  tratzberg: { text:"Замок построен в 1500-х годах на месте сгоревшей крепости купеческими семьями Танцль и Ильзунг, разбогатевшими на серебре Шваца. Здесь останавливался Максимилиан I. Главное — Габсбургский зал с родословным древом семьи, написанным на стене длиной 46 метров: 148 фигур, заказ 1508 года.", facts:["Замок никогда не разрушался и не перестраивался радикально — интерьеры XVI века подлинные."] },
  hall_tirol: { text:"Халль разбогател на соли раньше Зальцбурга и в XV веке был крупнейшим городом Тироля. В 1477 году эрцгерцог Сигизмунд перенёс сюда монетный двор, а в 1486-м здесь отчеканили гульдинер — первую большую серебряную монету Европы, эквивалент золотого гульдена. Чехи, копируя её из иоахимстальского серебра, назвали свою «иоахимсталер», сокращённо талер; от талера — голландский daalder и английский dollar. Монетный двор в замке Хазегг чеканил до 1809 года; сейчас это музей с действующим прессом.",
    facts:["Первый в мире вальцевальный чеканочный станок (1567) стоял именно здесь.","Башня Münzerturm — символ города, вид на долину Инна.","Старый город Халля — самый большой сохранившийся средневековый ансамбль Тироля."] },
  bergisel: { text:"На холме Бергизель в 1809 году тирольские ополченцы Андреаса Хофера трижды разбили баварские и французские войска, восстав против Наполеона, отдавшего Тироль Баварии. Хофера предали, расстреляли в Мантуе и похоронили в Хофкирхе. Трамплин на холме стоит с 1925 года; нынешний, 2002-го, построила Заха Хадид — башня с лифтом, рестораном и стартовой площадкой, откуда прыгали на Олимпиадах 1964 и 1976. Рядом Tirol Panorama — круговая картина 1896 года о битве, 1 000 квадратных метров.",
    facts:["С вершины видно кладбище Вильтен внизу — так задумано архитектором.","Панораму на рубеже веков возили по Европе как аттракцион."] },
  stams: { text:"Аббатство основано в 1273 году графом Мейнхардом II Тирольским как родовая усыпальница: здесь лежат тирольские князья, включая Фридриха IV «с пустым кошельком», и родители Мейнхарда. Барочную перестройку XVII–XVIII веков венчают две луковичные башни, а «Роза Тироля» — кованая решётка 1716 года работы Бернхарда Бахната — считается лучшим произведением художественной ковки в Австрии. Монастырь действующий, с гимназией и винодельней.",
    facts:["В усыпальнице — резной алтарь-«древо» с 84 фигурами.","Вино аббатства продаётся в лавке при входе."] },
  werdenberg: { text:"Городок при замке графов Верденберг вырос в XIII веке и никогда не расширялся: шестьдесят деревянных домов у озера, улица Städtli и замок над ними — это весь город, самый маленький в Швейцарии, и один из немногих полностью деревянных средневековых поселений страны. Дома XV–XVII веков расписаны, с эркерами и гербами; замок — музей истории Рейнской долины.",
    facts:["Название «Верденберг» — по замку, а не по городу: города как единицы здесь нет, только улица.","Озеро — искусственное, XVII век, для рыбы."] },
  luzern: { text:"Люцерн вырос у выхода Ройса из Фирвальдштетского озера на пути через Готард. Часовенный мост построили в 1333 году как часть городских укреплений — он идёт наискось через реку с восьмиугольной Водонапорной башней посередине, где держали архив и пытали. В стропилах — 111 картин XVII века о швейцарской истории и городских святых; в августе 1993 года пожар уничтожил две трети моста и большинство картин, восстановили за восемь месяцев. Умирающий лев — скульптура 1821 года по проекту Торвальдсена в память о 760 швейцарских гвардейцах, погибших 10 августа 1792 года при штурме Тюильри, защищая Людовика XVI.",
    facts:["Уцелевшие картины — тёмные, обгоревшие; новые — светлые копии.","Лев лежит на щите с лилиями Бурбонов, в боку — обломок копья.","Марк Твен в «Пешком по Европе»: «самое печальное и трогательное каменное изваяние в мире»."] },
  prague_parking: { text:"Малая Страна — зона для резидентов: уличная парковка гостям запрещена, эвакуатор работает. MR.PARKIT — чешский сервис частных площадок во дворах домов: бронь онлайн, ворота открываются с телефона.", facts:[] },
  innsbruck_parking: { text:"Альтштадт Инсбрука пешеходный; ближайшие гаражи — Congress у Хофбурга и Markthalle у моста Иннбрюкке.", facts:[] },
  feldkirch_parking: { text:"Старый город Фельдкирха — Kurzparkzone до 18:00; ночью улицы бесплатны, но надёжнее гараж под Marktplatz.", facts:[] },
  bergen_parking: { text:"Bygarasjen — крупнейший паркинг центра Бергена, под автовокзалом; центр города в 3–10 минутах пешком.", facts:[] },
  bud_airport: { text:"Аэропорт Ferihegy (BUD) в 16 км от центра. Терминал 2A — Шенген, 2B — вне Шенгена. Автобус 100E — прямой в центр.", facts:[] },
  vienna_pickup: { text:"Wien Hauptbahnhof (2014) — главный вокзал Австрии; отсюда Railjet во все стороны. Стойки проката — внутри, машины в гараже под вокзалом. Вена — бывшая столица империи Габсбургов, но в этом плане она транзитная точка: город стоит отдельной поездки.", facts:[] },
  zrh_return: { text:"Zürich Airport (Kloten) — крупнейший аэропорт Швейцарии. Возврат прокатных машин — в Parkhaus P3/P6 по указателям Mietwagen. Рядом The Circle — новый комплекс с отелями и ресторанами, куда можно дойти пешком.", facts:[] },
  bgo_return: { text:"Возврат машин BGO — парковка прокатчиков у терминала по указателям Leiebil. Wizz Air летает из терминала; check-in онлайн.", facts:[] },
  bud_departure: { text:"Терминал 2B для рейсов вне Шенгена (Дубай). Приезжать за 2,5 часа.", facts:[] },
  prague_hotel: { text:"Прага — столица Богемии с IX века, при Карле IV (XIV век) — столица Священной Римской империи и крупнейший город Европы после Рима и Константинополя. Исторический центр — ЮНЕСКО с 1992 года. Город почти не пострадал во Второй мировой, поэтому здесь сохранилась застройка всех эпох от романики до модерна.", facts:["Вечером после 21:00 Карлов мост пустеет — лучшее время."] },
  salzburg_hotel: { text:"Зальцбург — город Моцарта и «Звуков музыки», до 1816 года не Австрия, а самостоятельное церковное княжество. Старый город зажат между рекой Salzach и горой Mönchsberg; Altstadt закрыт для машин — заезд только к гаражу.", facts:[] },
  fuel_brno: { text:"Брно — второй город Чехии, столица Моравии. По плану мы проезжаем мимо по D1; если захочется 40 минут — вилла Тугендгат (Мис ван дер Роэ, 1930, ЮНЕСКО) и собор на Петрове.", facts:[] },
  fuel_feldkirch: { text:"Feldkirch — средневековый городок на границе с Лихтенштейном, замок Schattenburg над центром. Последний австрийский город на пути.", facts:[] },
  fuel_kloten: { text:"Kloten — городок у аэропорта Цюриха, 5 минут до возврата машин.", facts:[] },
