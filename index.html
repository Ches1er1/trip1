const TOUR = {
  vienna_centre: {
    guide:"Вы выходите из метро на Stephansplatz, и первое, что делает собор — заставляет поднять голову. Южная башня, 136 метров, простояла с 1433 года и до XIX века была самой высокой постройкой Европы после Страсбурга. Обойдите собор с юга: там, у стены, — кафедра Капистрана, с которой в 1451 году францисканец призывал к крестовому походу против турок; через 78 лет турки стояли под этими стенами. Внутрь пускают бесплатно в западную часть нефа — оттуда видна кафедра Пильграма (1515) с «человеком в окне»: мастер вырезал самого себя, выглядывающего из-под лестницы. С Graben начинается имперская Вена: это бывший ров римского лагеря Виндобона, засыпанный в XII веке на деньги от выкупа за Ричарда Львиное Сердце, которого австрийцы поймали по дороге из крестового похода. Чумная колонна (1693) — благодарность Леопольда I за окончание эпидемии 1679 года, в которой умерло 76 000 венцев. Дальше Kohlmarkt с Demel — кондитерской двора Габсбургов с 1786 года, и Michaelerplatz, где в 1990-х выкопали римские руины прямо посреди площади. Купол Michaelertor ведёт в Hofburg — 2 600 комнат, 640 лет власти одной семьи. Пройдите насквозь к Heldenplatz: слева Новый Хофбург с балкона которого в марте 1938-го Гитлер объявил аншлюс, впереди — Ратуша и Парламент за Ringstraße. Кольцо бульваров — тоже след истории: Франц Иосиф в 1857 году приказал снести крепостные стены, потому что в революции 1848-го они мешали не врагу, а войскам стрелять по своим.",
    look:["Крыша собора: 230 000 глазурованных черепиц, с юго-востока виден двуглавый орёл Габсбургов, с севера — гербы Вены и Австрии (выложены после войны).","«Человек в окне» на кафедре Пильграма — автопортрет мастера под ступенями.","Demel на Kohlmarkt: витрина с сахарными скульптурами — сотрудницы до сих пор обращаются к гостям в третьем лице, как при дворе.","Michaelerplatz: раскопки римского и средневекового слоёв под ногами, огорожены, бесплатно.","Loos-Haus напротив Michaelertor — «дом без бровей» (1911), скандал: император задёргивал шторы, чтобы его не видеть."],
    tip:"Ужин: Figlmüller на Wollzeile — шницель 30 см, бронировать; или Plachutta (тафельшпиц) на Wollzeile же. После ужина — кофе и захер в Café Sacher или, если очередь, в Café Central. Обратно U1 от Stephansplatz — 8 минут до отеля." },
  prague_castle: {
    guide:"Град — это не замок, а город на холме: девять веков власти, уложенные слоями. Заходите через Hradčanské náměstí — здесь стоят ворота с «Борющимися титанами» (1768), у которых меняется караул. Первый двор — самый молодой, времён Марии Терезии. Через ворота Матиаса (1614, первое барокко в Праге) — второй двор с часовней Святого Креста и колодцем. И только в третьем дворе вы упираетесь в собор. Собор св. Вита строили 585 лет: Карл IV начал его в 1344 году, наняв Матье из Арраса и затем 23-летнего Петра Парлержа, а закончили в 1929-м, к тысячелетию смерти св. Вацлава. Поэтому западный фасад с розой — неоготика XX века, а хор с алтарём и часовня св. Вацлава — подлинный XIV век. Часовня Вацлава — главное: стены до высоты человека выложены полудрагоценными камнями (яшма, аметист), над ними фрески 1509 года, а за дверью с семью замками — коронационные регалии, которые показывают раз в несколько лет. Витраж Альфонса Мухи (1931) — третий слева от входа: Кирилл и Мефодий, оплачен банком Славия, и логотип банка вписан внизу. Старый королевский дворец — Владиславский зал с сетчатым сводом Бенедикта Рейта (1502), в который рыцари въезжали верхом по Всаднической лестнице; отсюда в 1618 году выбросили из окна двух императорских наместников — так началась Тридцатилетняя война (они упали в навозную кучу и выжили). Золотая улочка — крохотные дома замковой стражи XVI века, позже — ремесленников и Кафки (дом 22, 1916–17). Спускаетесь по Старым замковым лестницам: 121 ступень, вид на Малую Страну и город.",
    look:["Мозаика «Страшный суд» над Золотыми воротами собора (южный фасад, 1371) — миллион кусочков венецианского стекла, единственная такая к северу от Альп.","Гробница св. Яна Непомуцкого в соборе — 2 тонны серебра, ангелы держат балдахин; язык святого (по легенде нетленный) хранился здесь.","Владиславский зал: рёбра свода не несут ничего — это чисто декоративная «готика напоказ», предвестие ренессанса.","Окно дефенестрации в Людвиговом крыле дворца — с табличкой.","На Золотой улочке дом №13 — реконструкция жилья стражника, вход по билету."],
    tip:"Приходить к 09:00 к воротам с титанами: досмотр без очереди, в соборе первые 30 минут почти пусто. Circuit B достаточно (собор, дворец, Золотая улочка, базилика св. Георгия). Аудиогид не нужен — здесь всё в приложении. Туалеты — во втором дворе." },
  mala_strana: {
    guide:"Малая Страна — город, который сгорел в 1541 году и был отстроен как барочная декорация. Спустившись с лестниц, вы попадаете на Malostranské náměstí, разделённую надвое собором св. Николая — тем, ради которого сюда идут. Это вершина пражского барокко: отец и сын Динценхоферы, 1704–1755, купол 70 метров, фреска «Апофеоз св. Николая» площадью 1 500 м² — одна из крупнейших в Европе. Моцарт играл здесь на органе в 1787-м, а после его смерти именно тут отслужили реквием: пражане любили его больше венцев. Nerudova — улица, где дома вместо номеров имеют знаки: «У двух солнц» (№47, дом поэта Яна Неруды), «У трёх скрипок» (№12, семья скрипичных мастеров), «У золотой подковы». Номера домов ввела только Мария Терезия в 1770 году. Дальше — Kampa, остров между Влтавой и каналом Чертовка с мельничным колесом; в 2002 году вода стояла здесь на три метра выше — отметка на стене музея Kampa. Стена Леннона на Velkopřevorské náměstí: с 1980 года студенты писали здесь стихи Битлз назло режиму, полиция закрашивала, они писали снова. Сегодня это единственное место в Праге, где граффити разрешены.",
    look:["Внутри св. Николая: отражение купола в зеркале у входа — чтобы не задирать голову; посмотрите на фреску купола — Троица, 1752.","Nerudova №47 «У двух солнц» — Неруда, в честь которого Пабло Неруда взял псевдоним.","Kampa: мельничное колесо Velkopřevorský mlýn работает.","Чертовка — «Пражская Венеция», лучшая точка с моста у стены Леннона."],
    tip:"Обед на Кампе: Café Savoy (бронировать, венская классика) или U Modré kachničky (утка, дороже). Св. Николай — вход ~CZK 100, 20 минут внутри достаточно." },
  charles_bridge: {
    guide:"Карлов мост заложили 9 июля 1357 года в 5:31 утра — Карл IV верил в нумерологию, и дата образует палиндром 1-3-5-7-9-7-5-3-1. Пётр Парлерж, архитектор собора, строил его 45 лет. До 1841 года это была единственная переправа через Влтаву, и по нему шёл торговый путь Восток–Запад. Тридцать статуй поставили в 1683–1714 годах иезуиты, превратив мост в барочную галерею под открытым небом; почти все оригиналы теперь в музеях, на мосту — копии. Главная — восьмая справа при движении от Малой Страны: св. Ян Непомуцкий, генеральный викарий, которого в 1393 году король Вацлав IV велел сбросить с моста в мешке за отказ выдать тайну исповеди королевы. На постаменте два бронзовых рельефа, натёртых до блеска: правая рука касается падающего святого «на возвращение в Прагу». Староместская мостовая башня (Парлерж, 1380) — одна из красивейших готических башен Европы: на восточном фасаде Карл IV и Вацлав IV сидят по сторонам св. Вита; в 1621 году здесь 10 лет висели головы казнённых лидеров восстания. С середины моста слева виден Град целиком — это и есть самая тиражируемая панорама Праги.",
    look:["Св. Ян Непомуцкий — единственная бронзовая статуя, остальные каменные; звёзды в нимбе — пять, по легенде о звёздах над телом в реке.","Бородач у опоры — каменная голова на второй арке, по ней ориентировались о паводках.","Крест с золотыми еврейскими буквами (1696) — оплачен штрафом еврея, якобы насмехавшегося над распятием.","С моста в сторону Малой Страны: Чертовка справа, Кампа слева внизу."],
    tip:"На мосту в 11:00 — 5 000 человек. В 07:30 — вы и фотографы. Вечером после 21:30 — снова тихо и подсвечен Град. Башня Старого Места (~CZK 190) — лучший кадр моста сверху, поднимайтесь на закате." },
  old_town_sq: {
    guide:"Площадь — сцена чешской истории, на которой сходятся все её акты. Рынок с XII века; здесь в 1437 году казнили последнего гуситского гетмана Яна Рогача; здесь 21 июня 1621 года — 27 протестантских лидеров восстания против Габсбургов, и 27 белых крестов выложены в мостовой у ратуши на месте эшафота. Здесь в феврале 1948-го Клемент Готвальд объявил с балкона дворца Кинских о победе коммунистов — и здесь же в 1968 году стояли танки. Орлой на Староместской ратуше — 1410 год, мастер Микулаш из Кадани и астроном Ян Шиндел; это третьи по возрасту астрономические часы мира и старейшие из работающих. Верхний циферблат показывает четыре времени одновременно: староческое (24 часа от заката), обычное, вавилонское и звёздное, плюс положение Солнца и Луны в зодиаке. Нижний — календарь Йозефа Манеса (1866) с месяцами. Каждый час: скелет (Смерть) звонит и переворачивает часы, Турок качает головой, Скупец трясёт кошелём, Тщеславие смотрится в зеркало, в окошках проходят 12 апостолов, петух кричит. Всё представление — 45 секунд. Тынский храм с двумя 80-метровыми башнями (не симметричными — «Адам и Ева») был главной церковью гуситов; у алтаря похоронен Тихо Браге, астроном Рудольфа II. Дом «У минуты» слева от ратуши — сграффито XVI века, в нём жил Кафка в 1889–96.",
    look:["27 крестов в мостовой у ратуши и табличка с именами.","Верхний циферблат Орлоя: золотая рука на внешнем кольце с готическими цифрами — староческое время.","Тынский храм: башни разной толщины — легенда про мужскую и женскую половину; вход через пассаж под домами.","Дворец Кинских (розовый, рококо) — тот самый балкон Готвальда; в его гимназии учился Кафка.","Ян Гус в центре площади (1915) — поставлен к 500-летию сожжения."],
    tip:"Орлой стоит увидеть один раз, не ждите его 40 минут — подойдите за 5 минут до часа. Башня ратуши — лифт, ~CZK 350, лучший вид на площадь и Тын. Рестораны на самой площади — туристические; еда — на Dlouhá или в Josefov." },
  josefov: {
    guide:"Еврейский квартал — то, что осталось от гетто, существовавшего здесь с XIII века до 1850 года, когда Иосиф II дал евреям права (квартал носит его имя). В 1890-х трущобы снесли и проложили Pařížská — парижский бульвар с модерном; уцелели шесть синагог, ратуша и кладбище. Староновая синагога (около 1270) — старейшая действующая в Европе, готический двухнефный зал с пятичастным сводом (шестое ребро убрали, чтобы не было креста). По легенде, на её чердаке лежит Голем — глиняный великан, которого рабби Лёв создал в XVI веке для защиты общины и обездвижил, когда он вышел из-под контроля; лестница на чердак снята. Старое еврейское кладбище работало с 1439 по 1787 год на площади меньше футбольного поля: хоронить можно было только здесь, поэтому земли досыпали, и могилы лежат в 12 слоёв — 12 000 надгробий, около 100 000 захоронений. Самая известная могила — рабби Лёва (1609): на неё до сих пор кладут записки с просьбами. Пинкасова синагога — мемориал: на стенах от руки написаны 77 297 имён чешских и моравских евреев, погибших в Холокост, с датами рождения и депортации. Нацисты не разрушили квартал: они собирали сюда конфискованное имущество для «музея исчезнувшей расы» — так уцелели коллекции.",
    look:["Староновая синагога: отметка на стене — уровень воды паводка 1890 года; бима с готической решёткой; флаг с шестиконечной звездой, дарованный Карлом IV — старейший символ еврейской общины.","Кладбище: надгробие Мордехая Майзеля (1601), примаса, финансировавшего Рудольфа II; символы ремесла на камнях — ножницы у портного, скрипка у музыканта.","Пинкасова синагога, второй этаж: рисунки детей из Терезина — 4 500 рисунков, из которых уцелели дети только на 100.","Еврейская ратуша с часами на иврите, идущими против часовой стрелки."],
    tip:"Единый билет Еврейского музея (~CZK 500–600) покрывает всё, кроме Староновой синагоги (отдельно ~CZK 250). В субботу всё закрыто — у нас пятница/четверг, ок. Мужчинам на входе выдают кипу. 1,5 часа — оптимально; больше тяжело эмоционально." },
  sedlec: {
    guide:"Костница — маленькая часовня, в которой лежат 40 000 человек. История начинается в 1278 году: аббат цистерцианского монастыря Генрих привёз из Иерусалима горсть земли с Голгофы и рассыпал на кладбище. После этого хотеть быть похороненным в Седлеце стала вся Центральная Европа: чума 1318 года дала 30 000 могил, гуситские войны — ещё тысячи. В XVI веке полуслепой монах начал складывать кости из упразднённых могил в подвал часовни в пирамиды. А в 1870 году владельцы, князья Шварценберги, наняли резчика Франтишека Ринта привести кости в порядок — и он сделал из них искусство: люстра, в которой использована каждая кость человеческого скелета, герб Шварценбергов с вороном, выклёвывающим глаз турку (за победу под Рабом, 1598), гирлянды черепов, и его собственную подпись костями на стене справа от входа. Ринт отбеливал кости хлорной известью — отсюда светлый цвет. Это не хоррор и не сувенир: барочная идея memento mori — все равны перед смертью, и кости князя и крестьянина висят в одной люстре.",
    look:["Люстра в центре: найдите хотя бы тазовую кость, лопатку и позвонки.","Герб Шварценбергов слева: ворон и голова турка — всё из костей.","Подпись Ринта — 1870, костями, справа от входа.","Четыре пирамиды по углам — XVI век, до Ринта; черепа с отверстиями — раны гуситских войн.","Сверху, в часовне Всех Святых — редкий пример двухуровневого кладбищенского храма (около 1400)."],
    tip:"Билет — в инфоцентре напротив, не в костнице. Съёмка — уточнить на кассе (с 2019 года ограничивают). Внутри 15–20 минут достаточно; в 09:15 вы почти одни, автобусы из Праги приезжают к 11:00." },
  st_barbara: {
    guide:"Кутна Гора в XIV веке была вторым городом королевства и его кошельком: серебряные жилы под холмом давали треть европейского серебра, а Влашский двор чеканил пражский грош — валюту от Балтики до Адриатики. Шахтёры строили собор своей покровительнице св. Варваре на собственные деньги и назло Праге — как ответ собору св. Вита. Начали в 1388 году по проекту сына Петра Парлержа, строили с перерывами 500 лет: гуситские войны, истощение рудников в XVI веке (когда деньги кончились, собор укоротили и закрыли временной стеной, простоявшей 300 лет), достройка в неоготике до 1905 года. Три шатровые кровли, похожие на палатки, и лес аркбутанов — работа Бенедикта Рейта, того же, что строил Владиславский зал в Граде. Внутри — то, чего нет в других соборах: позднеготические фрески горняков за работой в шахтёрских капюшонах-«пертлах» и монетчиков за чеканкой (около 1490), потому что заказчиками были они. Свод Рейта — сетчатый, с гербами цехов и города. Подход к собору — по террасе Barborská с 13 барочными статуями (1700-е, копия Карлова моста в миниатюре) и видом на долину Врхлице и иезуитский колледж. Центр города — Влашский двор (монетный двор, 1300), Каменный дом с готическим эркером, чумная колонна.",
    look:["Фрески в часовнях за алтарём: шахтёр с фонарём и кожаным «пертлом» на бёдрах — рабочая одежда для спуска по стволу; монетчик у наковальни.","Свод: гербы гильдий — минцмейстеров, шахтёров, корчмарей.","Витражи 1898–1939 годов Франтишека Урбана — модерн в готике.","Статуя шахтёра в белом капюшоне снаружи — эмблема города.","С террасы Barborská — вид на собор в профиль с аркбутанами, лучший кадр."],
    tip:"Combo-билет (костница + собор + Успенский собор Седлеца) ~CZK 340. Обед в Kutná Hora: Dačický (пивоварня, чешская кухня) на Rakova — историческое здание. Парковка Kremnická под собором — 2 минуты пешком." },
  hohensalzburg: {
    guide:"Крепость заложил архиепископ Гебхард в 1077 году — в разгар борьбы папы и императора за право назначать епископов; Зальцбург был на стороне папы, и стены строились против собственного императора. За 900 лет крепость ни разу не взяли штурмом: единственная осада — восставшие крестьяне 1525 года — провалилась. Почти всё, что вы видите, — работа одного человека: архиепископ Леонард фон Койчах (1495–1519) утроил крепость, провёл первый в мире фуникулёр (Reisszug, 1502, для грузов — работает до сих пор) и построил «Княжеские покои» с золотыми звёздами на потолке, витой резьбой и изразцовой печью 1501 года — редчайший сохранившийся интерьер поздней готики. Его герб с репой — везде (58 раз); легенда говорит, что дядя бросил в него репой со словами «учись или иди в поле». Зальцбург не был Австрией до 1816 года — это было самостоятельное церковное княжество, живущее на соли, и крепость — власть архиепископа над городом, а не защита от внешних врагов. С бастионов — панорама: барочный центр внизу, Untersberg на юге (в нём, по легенде, спит Карл Великий), Гайсберг на востоке.",
    look:["Золотая палата в Княжеских покоях: потолок с золотыми шишками-«звёздами» на синем, витая колонна из красного мрамора.","Изразцовая печь 1501 года — майолика с портретами библейских и античных героев, топится из коридора, чтобы не пачкать зал.","«Зальцбургский бык» — орган-барабан на башне (1502): играет в 7:00, 11:00 и 18:00 — вы услышите в 11 или 18.","Reisszug — деревянный грузовой подъёмник Койчаха в восточной части, старейший действующий фуникулёр мира.","Панорама с Kuenburg-бастиона: собор, Kollegienkirche, вид на Untersberg."],
    tip:"Онлайн-билет с таймслотом фуникулёра снимает очередь. Наверху 1,5 часа: покои с аудиогидом (в билете), стены, панорама. Вниз — пешком через Mönchsberg (15 минут) к Getreidegasse: вид на город с другой стороны и никаких очередей." },
  salzburg_old_town: {
    guide:"Зальцбург разбогател на соли, которую везли по реке Salzach, — и архиепископы потратили эти деньги на то, чтобы построить итальянский город к северу от Альп. Вольф Дитрих фон Райтенау в 1598 году снёс сгоревший романский собор и полгорода, чтобы проложить площади; его преемник Маркус Ситтикус нанял Сантино Солари, и в 1628 году освятили собор — первое барочное здание по эту сторону Альп, с фасадом из унтерсбергского мрамора и куполом 71 метр. В купели XIV века у входа крестили Моцарта 28 января 1756 года — она стоит слева. Residenzplatz с фонтаном 1661 года — крупнейшим барочным фонтаном вне Италии — обрамлён Резиденцией и Новой Резиденцией с карильоном (35 колоколов, играют в 7, 11 и 18). Getreidegasse — средневековая торговая улица: узкая, потому что участки были узкие и глубокие, дома с проходными дворами-пассажами; кованые цеховые вывески — средневековая «реклама» для неграмотных, и городской закон обязывает делать их и сегодня (посмотрите на McDonald's). В доме №9 на третьем этаже родился Моцарт; семья снимала квартиру у торговца специями. Вход — если хотите, но интереснее сам дом снаружи и пассажи.",
    look:["Собор: три бронзовые двери 1958 года — Вера, Надежда, Любовь; цифры 774–1628–1959 над порталом — три освящения.","Купель Моцарта — слева от входа, романская, с львами XII века.","Residenzplatz: карильон играет в 11:00 и 18:00 — моцартовские мелодии.","Getreidegasse №9 — жёлтый дом Моцарта; №3 — пассаж Schatz с ренессансным двориком.","Kollegienkirche на Universitätsplatz — Фишер фон Эрлах, 1707, самое строгое барокко города; рынок Grünmarkt перед ней."],
    tip:"Кофе: Café Tomaselli на Alter Markt (с 1700, старейшее в Австрии — торт выбирают с подноса). Обед: Zum Zirkelwirt или St. Peter Stiftskulinarium — ресторан при монастыре с 803 года, старейший в Европе (бронировать). Зальцбургский нокерль на десерт — на двоих, он огромный." },
  mirabell: {
    guide:"Дворец Альтенау построил в 1606 году архиепископ Вольф Дитрих — для Саломе Альт, дочери купца, с которой прожил 15 лет и родил 15 детей, оставаясь князем церкви. Когда его свергли и заточили в собственной крепости (он умер там в 1617-м), преемник переименовал дворец в Мирабель — «прекрасный вид» — чтобы стереть память о скандале. Сад в нынешнем виде — 1690 год, Фишер фон Эрлах: строгая ось на крепость, четыре группы скульптур по углам большого партера — похищение Прозерпины, Энея и Анхиза, Геракла и Антея, Парис и Елена — четыре стихии в мифах. Фонтан Пегаса (1913 на этом месте) и лестница за ним — та самая сцена «Do-Re-Mi» из «Звуков музыки» (1965), которую здесь поют ежедневно десятки туристов. «Сад гномов» слева от партера — 17 барочных карликов из мрамора (1715), высмеивающих придворных; их прятали в XIX веке как «безобразных» и вернули в 1919-м. Мраморный зал дворца — Моцарт играл здесь ребёнком; сегодня это самый желанный загс Австрии.",
    look:["Ось сада → крепость: вставайте у фонтана Пегаса спиной к дворцу — это кадр.","Сад гномов: гном с зубной болью, гном-турок, гном с горбом — портреты реальных придворных Франца Антона Харраха.","Лестница «Do-Re-Mi» — 7 ступеней у Пегаса.","Живая изгородь-туннель Heckentheater (1715) — один из старейших живых театров Европы."],
    tip:"Приходите после 17:30: солнце с запада подсвечивает крепость, толпа со «Звуков музыки» ушла. Ужин на Linzer Gasse в 5 минутах: Zum fidelen Affen (австрийская кухня, бронировать) или Gasthof Goldgasse." },
  gosausee: {
    guide:"Vorderer Gosausee — нижнее из трёх озёр в тупиковой долине Gosau, и это одно из немногих мест в Альпах, где ледник виден с уровня воды: над южным берегом стоит Dachstein (2 995 м) с ледником Gosaugletscher, а слева — зубчатый гребень Gosaukamm, известняковые башни до 2 400 метров. В штиль всё это лежит в воде целиком — фотография, которую тиражируют с 1880-х, когда сюда провели первую дорогу. Озеро — гидроэнергетическое с 1913 года: уровень чуть колеблется, но пейзаж не тронут ни курортами, ни канатками с этой стороны (канатка на Zwieselalm — в стороне). Тропа вокруг — 4 км, плоская, час; лучший вид — с дальнего южного конца, где озеро упирается в осыпь и виден Hinterer Gosausee дальше в долине. Долина входит в ЮНЕСКО как часть Hallstatt–Dachstein. Утром в понедельник — почти пусто.",
    look:["Отражение Dachstein — с дамбы у парковки, лучше до 10:00, пока ветра нет.","Gosaukamm слева: башня Bischofsmütze («митра епископа») — двойной зуб.","Ледник: серо-голубая полоса под вершиной — за 30 лет отступил на сотни метров, сравните со старой фотографией в Gasthof.","Родники на южном берегу — вода питьевая, ледяная."],
    tip:"Идти по часовой стрелке — солнце в спину на обратном пути. Кофе и Kaiserschmarrn в Gasthof Gosausee у парковки. Если облака сидят на Dachstein — 30 минут у берега и дальше: без гор озеро обычное." },
  hallstatt: {
    guide:"Гальштат — деревня в 750 жителей на полке между озером и скалой, давшая имя целой эпохе: гальштатская культура, 800–400 до н.э., — по 1 300 могилам железного века, найденным над деревней в 1846 году горным мастером Рамзауэром. Богатство — соль: её здесь добывают 7 000 лет, это старейшая действующая соляная шахта мира; в 1734 году в ней нашли «человека в соли» — доисторического шахтёра, законсервированного в пласте. До 1890 года в деревню не было дороги — только лодкой или тропой, и дома лепились друг на друга вверх по склону. Знаменитый вид — с северной окраины, от Gosaumühlstraße: церковь с острым шпилем, дома в воде, гора за ними. В 2012 году китайская компания построила полную копию Гальштата в Гуандуне, что удвоило поток туристов; сегодня в сезон — 10 000 человек в день, поэтому центр закрыт для въезда, а автобусам ограничили время стоянки.",
    look:["Костница у приходской церкви: 600 черепов, расписанных цветами и именами (XVIII–XX век) — обычай при нехватке места на кладбище.","Католическая церковь с алтарём 1515 года.","Вид с Gosaumühlstraße — тот самый кадр; и ещё один — с пристани.","Соляная шахта Salzwelten наверху (фуникулёр) — деревянные горки шахтёров, 2,5 ч, только если время и дождь."],
    tip:"Понедельник после 11:30 — парковка P2 обычно есть. Час: 10 минут до кадра, 30 по набережной, кофе. Не больше — деревня маленькая и переполненная." },
  ferleiten: {
    guide:"Дорогу через Glockner строили в 1930–1935 годах как проект против безработицы: 3 200 рабочих, 26 месяцев чистого строительства, 870 000 кубометров породы, кирками и динамитом. Инженер Франц Валлак спроектировал её как «дорогу-панораму»: она не ищет кратчайший путь, а показывает горы — отсюда лишние витки и два тупиковых ответвления. Ещё до Валлака здесь ходили: перевал Hochtor использовали кельты и римляне (при строительстве нашли бронзовую статуэтку Геракла I века до н.э.), а средневековые гуртовщики гнали через него скот на юг и несли вино и соль обратно. Сегодня дорогу ежегодно проезжают 900 000 человек, она — самая посещаемая платная достопримечательность Австрии и памятник техники. Ferleiten — касса (номер считывает камера), туалеты, табло с состоянием дороги. Дальше 48 километров — и это ваша программа на день.",
    look:["Табло: 'Edelweißspitze offen/gesperrt', 'Gletscherstraße', температура на Hochtor.","Сразу за кассой — Wildpark Ferleiten (не заезжаем) и первые витки в лесу.","Валлаковские каменные столбики вдоль обочины — оригинальные 1935 года."],
    tip:"Day-ticket многоразовый: можно выезжать и возвращаться. Топливо — ниже, в Bruck. Куртка — в салон, не в багажник: через час будет +5°C." },
  fuscher_toerl: {
    guide:"Перевал Fuscher Törl (2 428 м) — первое место, где дорога перевалила из долины Fusch в долину Seidlwinkl, и первое место, где виден Grossglockner — узкая пирамида на юго-западе. Башня на площадке — мемориал строителям дороги, погибшим в 1930–35 годах; архитектор — Клеменс Хольцмайстер, тот же, что строил парламент в Анкаре и Зальцбургский фестшпильхаус. Отсюда налево вверх уходит Edelweißstraße — два километра брусчатки на 2 571 м.",
    look:["Вид на юг: Grossglockner (3 798) — острая пирамида, слева Johannisberg с ледником.","Вид на север: долина Fusch, откуда вы приехали, витки дороги в ней.","Мемориальная башня — внутри имена погибших рабочих."],
    tip:"20 минут. Если Edelweißspitze открыта и небо ясное — не думайте, поднимайтесь: с Fuscher Törl видно 60% того, что с Edelweißspitze." },
  edelweissspitze: {
    guide:"Edelweißspitze — самая высокая точка Австрии, куда можно доехать на машине: 2 571 метр. Два километра брусчатки с 14 витками уложены в 1935 году и сохранены в оригинале — это часть памятника. Наверху — круговая панорама: 37 вершин выше трёх тысяч и 19 ледников, от Grossvenediger на западе до Grossglockner на юге. Гостиница на вершине — самая высокая в Австрии, с 1935 года. Эдельвейс на склонах — настоящий, охраняемый, штраф за сорванный цветок.",
    look:["Grossglockner на юге; Grossvenediger (3 657) на западе — белый купол; Sonnblick на востоке с обсерваторией (с 1886 года, самая высокая метеостанция Европы с непрерывными данными).","Кольцевая тропа вокруг вершины — 10 минут, с указателями вершин.","Брусчатка: посмотрите на кладку — ручная, «в ёлочку»."],
    tip:"30 минут. Наверху всегда ветер: куртка, шапка. При облаках ниже 2 500 м — не подниматься, смысла нет." },
  hochtor: {
    guide:"Hochtor — вершина проезжей части дороги, 2 504 метра, и граница земель Salzburg и Kärnten. Тоннель 311 метров прорублен в 1935 году; у его южного портала в 1933 году нашли кельтско-римскую статуэтку Геракла, а позже — римские монеты: люди ходили через этот перевал две тысячи лет. Снежные стены у портала стоят до июля; весной дорогу расчищают пять недель роторными снегоочистителями конструкции Валлака.",
    look:["Табличка границы Salzburg/Kärnten на портале.","Статуя св. Христофора у южного выхода — покровитель путников.","Вид на юг в Каринтию — уже другая погода: Hochtor — климатический раздел, на юге часто солнце, когда на севере облака."],
    tip:"10 минут. Здесь холоднее всего на дороге: ветер сквозь перевал." },
  kfjh: {
    guide:"Kaiser-Franz-Josefs-Höhe — площадка, куда в 1856 году поднялся пешком император Франц Иосиф с молодой Елизаветой и посмотрел на ледник; отсюда имя. Перед вами — Pasterze, самый длинный ледник Австрии, около 8 километров, и Grossglockner, 3 798 метров, высшая точка страны. Но главное, что здесь видно, — время: в 1856 году лёд лежал прямо под площадкой, а сегодня до него 250 метров вниз и полтора километра по долине; Pasterze потерял больше половины объёма и отступает на 30–50 метров в год. На склоне — отметки годов, показывающие, где стоял лёд. Gamsgrubenweg — тропа в скале с шестью тоннелями (около километра, плоская), проложенная в 1930-х; внутри тоннелей — свет и звук о горах и мифах (дракон Tatzelwurm), а выходы — балконы над ледником. Сурки на нижних парковках — ручные, стоят в полный рост и просят; кормить нельзя, фотографировать можно с двух метров. Grossglockner впервые покорили в 1800 году по заказу епископа Гурка Франца Ксавера фон Зальм-Райффершайда: экспедиция из 62 человек, включая плотников, которые построили хижину.",
    look:["Отметки уровня ледника на склоне — 1856, 1900, 1950, 2000: увидеть глазами, что такое сотня метров льда.","Grossglockner: острая вершина справа от Kleinglockner — между ними расщелина Glocknerscharte, самое опасное место маршрута.","Johannisberg — белый купол над началом ледника.","Gamsgrubenweg: в третьем тоннеле — легенда о золоте Pasterze.","Сурки — на парковках P1–P2 у входа в Gletscherbahn."],
    tip:"1,5–2 часа. Visitor Centre (в билете) — 20 минут, экспозиция о ледниках и строительстве. Обед: Panoramarestaurant или бутерброды на террасе с видом. Gletscherbahn — фуникулёр вниз к леднику — не нужен: лёд отступил дальше нижней станции." },
  heiligenblut: {
    guide:"Церковь св. Винцента (1491) на фоне Grossglockner — самый тиражируемый пейзаж Каринтии. Имя деревни, «Святая кровь», — от легенды: датский рыцарь Бриккиус нёс из Константинополя склянку с кровью Христа, погиб в лавине в 914 году, а на месте, где нашли тело, вырос колос сквозь снег. Реликвия хранится в церкви, в готическом дарохранительнице 1496 года. Отсюда в 1799–1800 годах стартовали первые восхождения на Glockner.",
    look:["Кадр: церковь с юга, от дороги вниз к деревне, с Glockner за шпилем.","Готический алтарь (1520) внутри — крылатый, из мастерской Михаэля Пахера.","Кладбище при церкви — могилы альпинистов и горных гидов."],
    tip:"Только при запасе >1,5 часа и ясном небе: спуск за южную кассу и подъём обратно — 40 минут дороги." },
  innsbruck_hotel: {
    guide:"Инсбрук — «мост через Инн», город на пути через Бреннер, самый низкий перевал Альп (1 370 м), по которому шли римляне, паломники, армии и купцы. Император Максимилиан I сделал его столицей около 1500 года и оставил Золотую крышу — балкон-эркер с 2 657 позолоченными медными черепицами, откуда смотрел турниры на площади; на рельефах — сам император с двумя жёнами и морисковые танцоры. Hofkirche — его пустая гробница: 28 бронзовых фигур в человеческий рост, «чёрные люди» — предки и герои, включая короля Артура, стоят вокруг саркофага, в котором никого нет (похоронен в Винер-Нойштадте). Maria-Theresien-Straße — барочный проспект с колонной св. Анны (1706) и Триумфальной аркой (1765), которую Мария Терезия заказала к свадьбе сына — и в дни свадьбы умер её муж, поэтому южная сторона арки праздничная, а северная траурная. Разноцветные дома на набережной Mariahilf — с моста Innbrücke, на фоне Nordkette. Инсбрук — единственный крупный город Европы, где горнолыжный склон виден с главной улицы.",
    look:["Золотая крыша: рельеф с Максимилианом между женами Марией Бургундской и Бьянкой Сфорца; гербы его земель.","Hofkirche: король Артур (по Дюреру) — самая известная фигура, отполированная руками.","Триумфальная арка: две стороны — радость и скорбь.","Helblinghaus на Herzog-Friedrich-Str. — рококо-лепнина 1730 на готическом доме.","Вид с Innbrücke на Mariahilf и Nordkette — кадр города."],
    tip:"Ужин: Stiftskeller (тирольская кухня, двор) или Die Wilderin (локальные продукты, бронировать). Утром выезд 08:00 — гараж отеля." },
  hungerburg: {
    guide:"Фуникулёр Hungerburgbahn (2007) спроектировала Заха Хадид: четыре станции из гнутого стекла — ледяные формы, «застывшие потоки». За 8 минут он поднимает с набережной Инна на террасу Hungerburg (860 м); выше идут две канатки на Seegrube (1 905) и Hafelekar (2 256) — Nordkette, «крыша Инсбрука», где начинается парк Karwendel. Нам достаточно террасы: город, долина Инна до Бреннера, вечерний свет.",
    look:["Станция Congress — вход внутри стеклянной волны Хадид.","Мост через Инн по пути — вагон наклоняется, сохраняя горизонтальный пол.","С террасы — стадион Bergisel с трамплином (тоже Хадид, 2002) на противоположном склоне."],
    tip:"~€12 туда-обратно, вечером до 19:30. Только при ясном небе." },
  arlberg: {
    guide:"Arlberg — перевал 1 793 метра, до XIX века единственная связь Форарльберга с Австрией; зимой его закрывали, и Форарльберг был фактически островом. St. Anton у восточного входа — родина горных лыж как спорта: в 1901 году здесь основали первый лыжный клуб Австрии, а Ханнес Шнайдер в 1920-х придумал «арльбергскую» технику поворотов и первую лыжную школу мира. Тоннель (14 км, 1978) — самый длинный автодорожный в Австрии, платный отдельно от виньетки. Перевальная дорога B197 — 20 минут дольше, через St. Christoph с госпиталем 1386 года (братство помощи путникам работает до сих пор) и Stuben — деревню, где родился Шнайдер.",
    look:["St. Christoph: Hospiz — отель на месте средневекового приюта, часовня XIV века.","На перевале — знак Tirol/Vorarlberg, панорама на Verwall.","Stuben: памятник Ханнесу Шнайдеру."],
    tip:"Ясно — перевал (бесплатно, красиво, +20 мин). Дождь/туман — тоннель (~€12.50, карта в кабине)." },
  vaduz: {
    guide:"Лихтенштейн — 160 км², 40 000 жителей, и последний живой осколок Священной Римской империи: княжество создано в 1719 году, когда Антон Флориан фон Лихтенштейн купил два графства, чтобы получить место в имперском рейхстаге — и никогда с тех пор не менял ни границ, ни династии. Князь Ханс-Адам II живёт в замке над Вадуцем (XII век, перестроен в 1905-м), поэтому внутрь нельзя; зато 15 августа он приглашает всю страну в сад на пиво. У страны нет армии (распущена в 1868 году после того, как 80 солдат вернулись с войны 1866-го в составе 81 человека — с итальянским другом), нет аэропорта, валюта — швейцарский франк, таможня общая со Швейцарией с 1923 года. Богатство — банки и точное машиностроение: Hilti (те самые перфораторы) и зубные протезы Ivoclar — из Шаана в двух километрах. Städtle — пешеходная улица с Ратушей, парламентом (2008, Ханс-Йорг Гёриц — здание из 1,2 млн кирпичей) и Kunstmuseum (чёрный бетонный куб). Штамп в паспорт за €3 в Tourist Info — единственный «пограничный» штамп страны, у которой нет пограничников.",
    look:["Замок: снизу с Städtle или с тропы Fürstensteig — 15 минут подъёма, вид на долину Рейна и Швейцарию напротив.","Парламент: кирпичный зал с треугольной крышей — на площади Peter-Kaiser-Platz.","Кафедральный собор св. Флорина (1874) — неоготика, усыпальница князей.","Марки: Лихтенштейн живёт на них с 1912 года; почта на Städtle продаёт свежие выпуски."],
    tip:"60 минут: Marktplatzgarage → Städtle 15 мин → штамп в Tourist Info → тропа к замку 15 мин вверх → фото → вниз → обед в Café Amann или сэндвич → машина. Дальше по A13 — уже Швейцария, виньетка должна быть куплена." },
  staubbach: {
    guide:"Staubbach — «пыльный ручей» — падает с уступа 297 метров и не касается скалы: на ветру струя рассыпается в водяную пыль ещё до земли. Это один из самых высоких свободно падающих водопадов Европы и главный водопад долины, у которой их 72. В 1779 году сюда приехал Гёте и написал под ним «Песнь духов над водами» — про то, как душа человека похожа на воду, а судьба на ветер. Байрон в 1816-м сравнил струю с «хвостом бледного коня Смерти». Тропа за водопадом вырублена в скале в 1990-х: вы стоите в нише в 100 метрах над деревней, а вода летит перед вами.",
    look:["Утром: солнце подсвечивает пыль над деревней — радуга в струе с 09:00 до 10:00.","Ниша за водопадом: вид сквозь воду на долину и Wengen на противоположном склоне.","Скала вокруг — известняк с горизонтальными слоями: долина — ледниковый трог, вырезанный за 20 000 лет."],
    tip:"15 минут вверх, скользко, куртка с капюшоном. 40 минут всего. Бесплатно." },
  truemmelbach: {
    guide:"Trümmelbach — единственный в Европе ледниковый водопад внутри горы, к которому можно подойти. Талая вода с ледников Eiger, Mönch и Jungfrau — с площади 24 км² — уходит в трещину известняка и выточила в горе десять водопадов, скрученных штопором; летом через них проходит до 20 000 литров в секунду и 20 000 тонн камня в год — это слышно как гул и чувствуется вибрацией под ногами. С 1913 года в скале работает лифт, а тоннели и балконы позволяют пройти все десять уровней. Внутри темно, мокро, +8°C и грохот такой, что не слышно соседа — «ледниковая мельница» в действии. Работает в любую погоду; в дождь воды больше и лучше.",
    look:["Уровень 6–7 после лифта: главная воронка — вода закручивается в скальной чаше и уходит вниз в темноту.","Цвет воды — молочно-серый: ледниковая мука, взвесь перемолотой породы.","На выходе вниз — старые фото 1913 года и первого лифта."],
    tip:"CHF 16, 09:00–17:00. Лифт вверх — пешком вниз по галереям, 45–60 минут. Куртка, обувь не скользкая. Дети до 4 лет не допускаются." },
  stechelberg: {
    guide:"Конец дороги. Дальше долина сужается в ущелье и уходит к ледникам без единой машины — только тропы и канатка на Gimmelwald, Mürren и Schilthorn (2 970 м, ресторан Piz Gloria, где в 1969 году снимали «На секретной службе Её Величества»). На стене над станцией — Mürrenbachfall, 417 метров, самый высокий водопад Швейцарии, разбитый на ступени. Напротив — Sefinenfall.",
    look:["Mürrenbachfall — над станцией, справа; Mürren — деревня на полке над ним.","Кабина Schilthornbahn уходит вертикально в скалу — новая линия 2025 года, самая крутая канатка мира (159%)."],
    tip:"20 минут: парковка канатки, прогулка вдоль реки к мосту, фото. Наверх не поднимаемся — дорого и не в плане." },
  grindelwald: {
    guide:"Гриндельвальд лежит под северной стеной Эйгера — 1 800 метров отвесного известняка, которые до 1938 года никто не мог пройти. Первые попытки 1935–36 годов кончились гибелью восьми человек на глазах у публики, наблюдавшей в подзорные трубы с террас отелей; бернское правительство запретило восхождения, а газеты назвали стену Mordwand — «стена смерти». В июле 1938 года четверо — Хекмайр, Фёрг, Каспарек и Харрер (тот самый автор «Семи лет в Тибете») — прошли её за четыре дня. Сегодня стену проходят за часы, но она осталась символом альпинизма. Гриндельвальд — старейший курорт Оберланда (англичане с 1860-х), отсюда в 1912 году пустили железную дорогу на Jungfraujoch (3 454 м) — до сих пор самую высокую в Европе. Два ледника — Верхний и Нижний Гриндельвальдские — в XIX веке спускались почти до деревни; сегодня их видно только в верховьях. Terrassenweg — тропа по солнечному склону над деревней с видом на стену Эйгера целиком, от подножия до вершины.",
    look:["Стена Эйгера: найдите глазами «Белого паука» — ледовое пятно в верхней трети, ключевое место маршрута 1938 года; и «окно Айгерванд» — станцию железной дороги внутри горы, из которого выглядывают туристы.","Wetterhorn на востоке — трёхглавый, над ним ущелье Нижнего ледника.","Terrassenweg: 20 минут вверх от церкви по указателям — вид без проводов и крыш.","Церковь Grindelwald (1793) с кладбищем альпинистов."],
    tip:"Обед с видом на Эйгер: Restaurant Onkel Tom's Hütte (пицца, вид) или Barry's. Парковка Grindelwald Terminal — большая, платная." },
  first: {
    guide:"First — травянистое плато на 2 168 метрах, куда гондола из Гриндельвальда поднимает за 25 минут. Cliff Walk (2015) — стальная тропа, вынесенная за край скалы, с висячим мостом и 45-метровой консолью, на конце которой — стеклянный пол и Эйгер прямо напротив. Но главное дальше: 50 минут по тропе среди пастбищ к озеру Bachalpsee (2 265 м) — два озера, разделённые плотиной, и в верхнем, если нет ветра, отражаются Schreckhorn и Finsteraarhorn (4 274 м, высшая точка Бернских Альп). Это самый фотографируемый вид Оберланда, и он бесплатный после подъёма. Обратно можно пешком тем же путём или на самокатах Trottibike вниз до Bort.",
    look:["Cliff Walk: стеклянная площадка на конце консоли; лучшая точка съёмки — с тропы позади.","Bachalpsee: подойти к верхнему озеру и присесть — отражение видно только с низкой точки.","По пути — коровы с колокольцами и мармоты в камнях слева от тропы.","Schreckhorn (4 078) — острый, Finsteraarhorn — за ним правее, Wetterhorn слева."],
    tip:"Решение в 07:30 по вебкамере. Первая гондола 08:00 — озеро без людей к 09:00. ~CHF 72 туда-обратно (уточнить), билет онлайн после решения. Наверху обед в Berggasthaus First. Обувь с подошвой, слои: наверху на 10°C холоднее." },
  interlaken: {
    guide:"Интерлакен — «между озёрами» — вырос вокруг монастыря XII века на перешейке между Thunersee и Brienzersee, а в XIX веке стал первым альпийским курортом англичан: с луга Höhematte в центре города виден Jungfrau целиком, и это охраняемый вид — застраивать луг запрещено с 1864 года. Brienzersee — самое чистое из больших озёр Швейцарии, бирюзовое от ледниковой взвеси. Iseltwald на южном берегу — рыбацкая деревня с замком на мысу, в 2019 году попавшая в корейский сериал «Аварийная посадка любви»; с тех пор у пристани очередь на фото у скамейки, но деревня осталась крохотной. Wengen — деревня на полке над долиной Лаутербруннен, без машин с XIX века, поезд 15 минут.",
    look:["Höhematte: Jungfrau в створе луга — кадр Интерлакена.","Iseltwald: пристань со «скамейкой из сериала» и замок Seeburg.","Brienz на восточном конце — деревня резчиков по дереву (если время).","Wengen: террасы отелей с видом на Jungfrau и Breithorn."],
    tip:"Утро 20-го: Iseltwald 30 минут от отеля, час у воды, обед в Interlaken (Restaurant Laterne или Husi Bierhaus). Выезд в Цюрих не позже 13:00." },
  steinsdalsfossen: {
    guide:"Steinsdalsfossen — 50-метровый водопад на реке Fosselva, появившийся на этом месте только в 1699 году, когда река сменила русло. Знаменит одним: тропа проходит за струёй по сухой скальной нише, и вы стоите за водой, не намокая. Кайзер Вильгельм II приезжал сюда каждое лето с 1889 по 1914 год на своей яхте — с него и началась мода на норвежские фьорды у европейской аристократии, и первые отели Хардангера построили для его свиты. Водопад — у самой дороги Rv7, идеальная первая остановка.",
    look:["Ниша за водопадом: вид сквозь струю на долину Steinsdalen и Norheimsund у фьорда.","Гидроэлектростанция снизу не портит кадр — она в стороне.","Стеклянный домик и тропа — реконструкция 2010-х по программе Национальных туристических дорог."],
    tip:"30 минут: парковка бесплатная, 5 минут вверх, за струёй, назад. Куртка — брызги." },
  hardanger_bridge: {
    guide:"Hardangerbrua (2013) — подвесной мост длиной 1 380 метров с главным пролётом 1 310 — один из десяти длиннейших в мире, пилоны 200 метров. Он заменил паром Bruravik–Brimnes, ходивший здесь 80 лет, и связал Берген с плато Hardangervidda и Осло без пересадок. Оба конца моста уходят прямо в тоннели — редкость: с воды кажется, что мост входит в гору. Хардангерфьорд под вами — 179 километров, второй по длине в Норвегии, глубина до 800 метров; склоны — фруктовые сады: яблони и вишни привезли монахи-цистерцианцы в XIII веке, и Хардангер до сих пор даёт 40% норвежских яблок и сидр с защищённым названием.",
    look:["С площадки Bu сразу за мостом (северная сторона) — мост в профиль и фьорд на юг.","Пилоны 200 м — выше, чем Golden Gate по высоте над водой.","Сады на склонах Ulvik и Lofthus — белые в мае, в сентябре с яблоками."],
    tip:"Toll списывается автоматически (~NOK 140). 5 минут на площадке Bu — и решение: с Vøringsfossen или без." },
  voringsfossen: {
    guide:"Vøringsfossen падает на 182 метра (145 свободного падения) в каньон Måbødalen с края Hardangervidda — самого большого горного плато Европы, 6 500 км² тундры на 1 200 метрах. Водопад открыл для туризма профессор Кристофер Хансен в 1821 году; к концу века сюда карабкались по тропе с 1 500 ступенями, вырубленной для лошадей, а отель Fossli (1891) на краю обрыва стал местом, где Эдвард Григ писал «Лирические пьесы». Дорога Rv7 через каньон — спиральные тоннели 1980-х. В 2020 году над пропастью перебросили ступенчатый мост (47 м, 99 ступеней): вы идёте над водопадом с одного края каньона на другой, и это единственное место, где видны сразу и падение воды, и глубина ущелья. Смотровые площадки (2018–2020) — часть программы Национальных туристических дорог.",
    look:["С моста: два водопада — Vøringsfossen и Tysvikofossen — сходятся внизу в каньоне.","Отель Fossli на краю — старейшее здание, вид с его террасы бесплатен.","Каньон Måbødalen вниз: дорога и старая пешеходная тропа в стене.","Плато за спиной — начало Hardangervidda: тундра, олени, ни одного дерева."],
    tip:"1 час на месте, парковка ~NOK 100 (автомат по номеру). Обед в Eidfjord внизу или бутерброды. Мост закрывают при обледенении — в сентябре открыт." },
  voss: {
    guide:"Voss — посёлок между Бергеном и Согне-фьордом, столица норвежского экстрима (Ekstremsportveko, парапланы, рафтинг) и родина олимпийских чемпионов. Деревянная церковь 1277 года пережила немецкую бомбардировку апреля 1940 года, стёршую центр посёлка. Здесь родился Кнут Рокне — тренер, сделавший американский футбол национальным спортом США. Для нас — последний большой супермаркет и заправка перед Аурландом.",
    look:["Церковь Vangskyrkja (1277) — каменная с деревянным шпилем, у озера.","Fleischer's Hotel (1889) — «швейцарский стиль» у станции, где останавливалась кайзеровская свита."],
    tip:"Kiwi/Rema 1000 у E16: завтрак и перекус на завтра — в Аурланде выбор маленький. Заправка Circle K." },
  aurland_hotel: {
    guide:"Aurlandsvangen стоит на Аурландсфьорде — ветви Согне-фьорда, самого длинного в Норвегии (205 км) и второго в мире после Скорсби. Фьорд здесь 29 км длиной, до 960 метров глубиной при ширине в два — вода темнее, чем небо. До 1980-х в Аурланд не было дороги: только море, тропы через плато и, зимой, отрезанность; E16 с тоннелями пришла в 1991 году. Деревня известна двумя вещами: церковью Vangen (1202, «собор Согна», каменная, редкая для этих мест) и туфлями — в 1930-х местный сапожник Нильс Твейеранд скопировал мокасины индейцев, увиденные в Америке, и «аурландские туфли» стали прообразом penny loafers, которые Bass выпустил как Weejuns (от Norwegians). Соседняя деревня Undredal — 100 жителей, 500 коз и самая маленькая ставкирка Скандинавии (1147).",
    look:["Церковь Vangen — каменная готика 1202 года у воды.","Фьорд вечером: без ветра — зеркало, в сентябре темнеет к 20:00.","Aurland Skofabrikk — фабрика туфель с магазином, если открыто."],
    tip:"Ужин: Aurland Fjordhotel (единственный полноразмерный) или Marianne Bakeri (кафе, закрывается рано) — бронировать или ужинать в Flåm (Ægir Brewery, викингский зал, 10 минут)." },
  stegastein: {
    guide:"Stegastein (2006) — смотровая на 650 метрах над Аурландсфьордом: 30-метровая консоль из ламинированной сосны, которая заканчивается стеклянным парапетом, наклонённым наружу — вы стоите на краю и видите только фьорд. Архитекторы Тодд Сондерс и Томми Вильхельмсен; это первый и самый известный объект программы «Национальные туристические дороги», по которой Норвегия с 1990-х ставит современную архитектуру на обочинах 18 маршрутов. Дорога до платформы открыта круглый год, дальше вверх — только летом. Утром до 10:00 — тишина; потом приезжают автобусы из Flåm с круизных лайнеров.",
    look:["С конца консоли — Аурландсфьорд на юг до Flåm и на север к Согне-фьорду; Undredal напротив внизу.","Конструкция: сосна норвежская, крепление — одна опора, консоль без стоек.","Туалет-«ящик» рядом — тоже объект программы, с панорамным окном."],
    tip:"30 минут, бесплатно, парковка на 30 мест. Дальше — не назад, а вверх: Снежная дорога начинается здесь." },
  aurlandsfjellet: {
    guide:"Fv 5627 — 47 километров через плато на 1 306 метрах между Аурландом и Лердалом. Дорогу построили в 1967 году как единственную связь между двумя фьордами; с 2000 года есть тоннель, и старая дорога стала чисто панорамной — одним из 18 Национальных туристических маршрутов. «Снежная дорога» — потому что снег у обочины лежит до июля; в сентябре его почти нет, зато плато открыто целиком: голый гранит, сотни озёр, мох, ни одного дома, ни одной опоры ЛЭП. Vedahaugane — площадка с бетонным «тоннелем времени» (Lars Berge, 2012) и скульптурой медведя в стеклянном ящике: художник Марк Дион о вымершем в Норвегии буром медведе. Спуск в Лердал — 15 витков серпантина над долиной. Дорога узкая, с разъездами; норвежцы едут 50, вы — сколько удобно.",
    look:["Vedahaugane (первая площадка на плато) — бетонный тоннель к обзорному балкону, медведь в стекле.","Высшая точка 1 306 м — озёра справа и слева, «лунный» пейзаж.","Овцы на дороге — с колокольчиками, не спешат.","Спуск в Erdal: серпантин над долиной Lærdal с рекой внизу — остановка на второй-третьей площадке."],
    tip:"1 ч 15 без остановок, 1 ч 45 с ними. Держать время: в Лердале к 11:45. Куртка — на плато ветер и +5°C. Статус утром: yr.no." },
  laerdal: {
    guide:"Lærdalsøyri — торговый посёлок в устье реки Lærdal, куда с XVII века приходил Королевский путь через горы из Осло: здесь товары перегружали с лошадей на лодки. Река Lærdal — «королевская лососевая»: британские лорды приезжали ловить с 1850-х, а норвежский король — до сих пор. 170 деревянных домов XVIII–XIX веков — один из лучших сохранившихся деревянных посёлков Норвегии; в январе 2014 года пожар при штормовом ветре уничтожил 40 домов, но старый центр Gamle Lærdalsøyri уцелел. В 30 км дальше по E16 — Borgund, самая известная ставкирка Норвегии (1180), не в плане: +1,5 часа.",
    look:["Øyragata — главная улица старого центра: дома-«свайтсерхаус» с резьбой, аптека 1830-х.","Норвежский центр дикого лосося у реки — лосось в стеклянном аквариуме в живой реке.","Мост через реку — вид на долину и склоны, по которым спускались."],
    tip:"45 минут: прогулка + обед (Lærdal Bakeri или кафе центра лосося). Если отстаём — 10 минут на фото и в тоннель." },
  laerdal_tunnel: {
    guide:"Lærdalstunnelen (2000) — самый длинный автодорожный тоннель в мире: 24,5 километра, 20 минут при 80 км/ч. Чтобы водители не теряли ориентацию и не засыпали, инженеры сделали три пещеры через каждые 6 км: синяя подсветка снизу и жёлтая сверху имитируют рассвет, и там можно развернуться (но не останавливаться). Воздух меняют электростатические фильтры и отдельная вентиляционная шахта — до этого столько времени под землёй считалось небезопасным. Тоннель сделал дорогу Осло–Берген круглогодичной без паромов. С сентября 2026 года — реконструкция: закрыт каждую ночь 18:00–06:00 примерно на два года.",
    look:["Три «голубые пещеры» — на 6, 12 и 18 км: подсветка, объезд по кругу.","Знаки расстояния каждые 500 м — до выхода.","На выезде в Аурланд — сразу дневной свет и фьорд."],
    tip:"Въезд с Лердала не позже 15:00 (план — 13:00). 80 км/ч, обгон запрещён, остановки — только в пещерах и только аварийные." },
  gudvangen: {
    guide:"Gudvangen — «долина богов» — конец Nærøyfjord: 17 километров фьорда шириной местами 250 метров между стенами до 1 700 метров, самого узкого из больших фьордов Европы и объекта ЮНЕСКО с 2005 года. С пристани фьорд уходит на север между отвесными склонами с водопадами — Kjelfossen (755 м, один из высочайших в Европе) виден прямо с парковки, справа над деревней. Здесь с 1880-х швартовались первые туристические пароходы; здесь же в эпоху викингов был торговый узел — путь из моря вглубь страны через долину Nærøydalen. Электрический катамаран Future of the Fjords (2018) ходит отсюда в Flåm — самый известный круиз Норвегии, но для машины он неудобен, и мы заменяем его дорогой в Bakka.",
    look:["Kjelfossen — 755 метров, три ступени, над деревней справа.","Фьорд на север с пристани: на середине — деревня Bakka на левом берегу, белая церковь.","Отвесные склоны — следы лавин: полосы без леса."],
    tip:"30 минут: парковка ~NOK 50, пристань, фото, дальше в Bakka." },
  bakka: {
    guide:"Bakka — хутор из десятка домов и белой деревянной церкви 1859 года на западном берегу Nærøyfjord, куда ведёт единственная дорога вдоль этого фьорда — 5 километров тупика. Дальше — только вода. До 1950-х дети ходили в школу в Gudvangen по тропе над водой, а зимой лавины отрезали хутор на недели. Отсюда фьорд виден с земли во всю глубину — то, что с E16 не видно вообще: стены смыкаются к северу у поворота на Undredal, вода зелёная от ледниковой мути. Это наша замена лодке.",
    look:["От церкви вниз к берегу — 5 минут: фьорд на север до поворота.","Церковь Bakka (1859) — образец «длинной церкви» с восемью окнами.","Отметки на скале у дороги — лавинные щиты."],
    tip:"40 минут туда-обратно. Дорога узкая, разъезды — уступает тот, кто ближе к карману. Парковка у церкви на 5 машин." },
  viking_valley: {
    guide:"Njardarheimr (2017) — не музей: деревня, построенная по археологическим данным, где живут и работают люди в одежде и быте IX–X веков — кузнец, кожевник, ткачи, повар, воины. Gudvangen выбран не случайно: с 1990-х здесь проходит крупнейший в Норвегии викингский рынок, а долина Nærøydalen в эпоху викингов была торговым путём между морем и внутренней Норвегией. Экскурсия (45 минут, английский, каждый час) ведёт по домам: длинный дом вождя, мастерские, святилище — и объясняет то, чего нет в сериалах: викинги были прежде всего фермерами и торговцами, женщины владели имуществом и разводились, а «рогатые шлемы» придумали в опере XIX века. После тура — метание топоров и стрельба из лука (включено), викингский суп в food house.",
    look:["Длинный дом: очаг в центре, дым уходит через крышу, скамьи-кровати вдоль стен.","Кузница: работают на угле, можно смотреть, как ковали наконечники.","Ткацкий станок вертикальный с грузами — реконструкция по находкам в Осеберге.","Метание топора — инструктор покажет: топор бросают с одного оборота."],
    tip:"1,5 часа. Билет ~NOK 280 (уточнить). Если выезд из Gudvangen позже 15:30 — только тур 45 минут. Работает в дождь — дома крытые." },
  bryggen: {
    guide:"Bryggen — Немецкая пристань: ряд деревянных контор Ганзейского союза, торговавшего здесь сушёной треской 400 лет, с 1360 по 1754 год. Ганзейцы жили закрытой мужской колонией: брак и огонь были запрещены — еду готовили в отдельных домах-кухнях за рядами. Дома горели и отстраивались каждый раз по тому же плану; нынешние — после пожара 1702 года, 62 здания, ЮНЕСКО с 1979-го. Между рядами — узкие проходы с наклонными стенами: здания оседают на сваях и подпирают друг друга. Рыбный рынок Fisketorget работает с 1200-х. Fløibanen (1918) за 8 минут поднимает на Fløyen (320 м): город, гавань и семь гор — Берген был столицей Норвегии до 1299 года и самым большим городом Скандинавии в средневековье.",
    look:["Проходы между домами Bryggen: наклонные стены, деревянные галереи, склады наверху с подъёмными колёсами.","Schøtstuene — залы собраний ганзейцев (музей, если время).","Fisketorget: рыбный суп в любой лавке — норвежский завтрак.","С Fløyen — гавань, Bryggen сверху, остров Askøy на западе."],
    tip:"08:30–10:30: Bryggen до открытия магазинов пустой; Fløibanen ~NOK 190 туда-обратно, первая кабина 07:30. Выезд в аэропорт 11:15, 30 минут." }
};

</script>
<script>
/* ===================== helpers ===================== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const TN={'MUST SEE':'ОБЯЗАТЕЛЬНО','OPTIONAL':'ПО ЖЕЛАНИЮ','PHOTO STOP':'ФОТО','VIEWPOINT':'СМОТРОВАЯ','ACTIVITY':'АКТИВНОСТЬ','FOOD':'ЕДА','HOTEL':'ОТЕЛЬ','AIRPORT':'АЭРОПОРТ','CAR RENTAL':'ПРОКАТ','FUEL':'ЗАПРАВКА','PARKING':'ПАРКОВКА','SCENIC ROAD':'ДОРОГА','PASS':'ПЕРЕВАЛ','CABLE CAR':'КАНАТКА','BOAT':'ЛОДКА'};
const POI = Object.fromEntries(DATA.pois.map(p => [p.id, p]));
const DN={Mon:'пн',Tue:'вт',Wed:'ср',Thu:'чт',Fri:'пт',Sat:'сб',Sun:'вс'};
const DAY = Object.fromEntries(DATA.days.map(d => [d.id, d]));
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ll = p => `${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
const short = n => String(n).split(/\s[—(+]/)[0].trim();
const gmPlace = p => p.googleMapsUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(short(p.name))}&query_place_id=&center=${ll(p)}`;
const gmNav   = p => `https://www.google.com/maps/dir/?api=1&destination=${ll(p)}&travelmode=driving`;
const gmFuel  = p => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('gas station')}&center=${ll(p)}`;
const gmHotel = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const bookingUrl = q => `https://www.booking.com/searchresults.html?ss=${encodeURIComponent(q)}`;
const gmDir = (ids) => {
  const pts = ids.map(id => POI[id]).filter(Boolean);
  if (pts.length < 2) return null;
  const o = pts[0], d = pts[pts.length-1], w = pts.slice(1,-1).slice(0,9);
  let u = `https://www.google.com/maps/dir/?api=1&origin=${ll(o)}&destination=${ll(d)}&travelmode=driving`;
  if (w.length) u += `&waypoints=${w.map(ll).join('|')}`;
  return u;
};
const wxLinks = {
  weather: (p) => `https://www.yr.no/en/search?q=${encodeURIComponent(short(p.name))}`,
  webcam: { d14:"https://www.grossglockner.at/en/for-your-visit/webcam-weather", d13:"https://www.dachstein-salzkammergut.at/en/webcams", d12:"https://www.koenigssee.com/webcams",
    d17:"https://www.jungfrau.ch/en-gb/live/webcams/", d18:"https://www.jungfrau.ch/en-gb/live/webcams/", d20:"https://www.yr.no/en/mountain-passes/south/61/Fv.%205627%20Aurlandsfjellet", d19:"https://www.yr.no/en/mountain-passes/south/61/Fv.%205627%20Aurlandsfjellet", d16:"https://www.vorarlberg.travel/en/webcams/" },
  road: { d14:"https://www.grossglockner.at/en/for-your-visit/prices-opening-times", d20:"https://www.vegvesen.no/trafikk/en", d19:"https://www.vegvesen.no/trafikk/en", d16:"https://www.asfinag.at/en/traffic/", d11:"https://www.asfinag.at/en/traffic/" }
};
let WX = 'good';
function setWx(m){ WX = m; $('#wx-good').classList.toggle('on', m==='good'); $('#wx-bad').classList.toggle('on', m==='bad'); renderItin(); renderToday(); if(map) renderMapDay(); try{localStorage.setItem('wx',m)}catch(e){} toast(m==='bad' ? 'ПЛОХАЯ ПОГОДА: погодные остановки зачёркнуты, показан план B' : 'ЯСНАЯ ПОГОДА'); }
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2000); }
function kind(p){ const t=p.type; if(t==='HOTEL')return'hotel'; if(t==='AIRPORT')return'air'; if(t==='CAR RENTAL')return'car'; if(t==='FUEL'||t==='PARKING')return'fuel'; if(t==='FOOD')return'food'; return p.priority==='MUST SEE'?'must':'opt'; }
function kindIcon(p){ return {"HOTEL":"🛏","AIRPORT":"✈","CAR RENTAL":"🔑","FUEL":"⛽","PARKING":"🅿","FOOD":"🍽"}[p.type]||''; }
function dayOf(p){ return DATA.days.find(d=>d.date===p.date); }
function isDropped(p){ return WX==='bad' && p.weatherDependent && p.type!=='HOTEL'; }
/* ordered stops of a day = unique POIs in timeline order */
function dayStops(d){ const seen=new Set(); const out=[]; d.timeline.forEach(t=>{ if(t.poi && POI[t.poi] && !seen.has(t.poi)){ seen.add(t.poi); out.push(POI[t.poi]); } }); return out; }
function stopNo(d,p){ return dayStops(d).findIndex(x=>x.id===p.id)+1; }


/* ===================== GUIDE blocks ===================== */
const G = id => (GUIDE.days||{})[id] || {};
function storyBlock(d){ const g=G(d.id); if(!g.story) return ''; return `<div class="story"><div class="story-h">📖 ЧТО ДЕЛАЕМ СЕГОДНЯ</div><p>${esc(g.story)}</p></div>`; }
function legsBlock(d){ const g=G(d.id); if(!g.legs||!g.legs.length) return '';
  return `<div class="legs2"><div class="story-h">🧭 КАК ДОБРАТЬСЯ — по шагам</div>${g.legs.map((l,i)=>`<div class="leg"><div class="leg-h"><b>${i+1}</b><span>${esc(l.from)} → ${esc(l.to)}</span><em>${esc(l.km)} km · ${esc(l.time)}</em></div><div class="leg-b">${esc(l.how)}</div>${l.links?`<div class="lk">${l.links.map(x=>`<a class="btn sm" href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)} ↗</a>`).join('')}</div>`:''}</div>`).join('')}</div>`; }
function logisticsBlock(d){ const g=G(d.id); if(!g.logistics||!g.logistics.length) return ''; return `<div class="logi"><div class="story-h">✅ ПРАКТИКА ДНЯ</div><ul>${g.logistics.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`; }
function practicalBlock(){ return `<div class="card"><div class="story-h" style="font-size:19px">📕 КАРМАННЫЙ ГИД</div><div class="muted">Где бронировать машину, виньетки, правила по странам, топливо, документы. Тап по разделу.</div>${(GUIDE.practical||[]).map((s,i)=>`<details class="prac"><summary>${esc(s.title)}</summary><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${s.links?`<div class="lk">${s.links.map(x=>`<a class="btn sm" href="${esc(x.u)}" target="_blank" rel="noopener">${esc(x.t)} ↗</a>`).join('')}</div>`:''}</details>`).join('')}</div>`; }

const ABOUT = (typeof HIST!=='undefined')?HIST:{};
const TOURS=(typeof TOUR!=='undefined')?TOUR:{};
function aboutBlock(p){ const a=ABOUT[p.id]; const t=TOURS[p.id]; if(!a&&!t) return '';
  let h='';
  if(a) h+=`<div class="about"><div class="story-h">📍 О МЕСТЕ</div><p>${esc(a.text)}</p>${a.facts&&a.facts.length?`<ul>${a.facts.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>`:''}</div>`;
  if(t) h+=`<div class="tour"><div class="story-h">🎧 ГИД</div>${t.guide.split(/(?<=[.!?»])\s+(?=[А-ЯЁA-Z«])/).reduce((acc,s,i)=>{ if(i%4===0) acc.push([]); acc[acc.length-1].push(s); return acc; },[]).map(par=>`<p>${esc(par.join(' '))}</p>`).join('')}
    ${t.look?`<div class="story-h" style="font-size:15px">👀 НА ЧТО СМОТРЕТЬ</div><ul>${t.look.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    ${t.tip?`<div class="tiptip">💡 ${esc(t.tip)}</div>`:''}</div>`;
  return h; }
/* ===================== POI card (full) ===================== */
function poiCard(p, opts={}){
  const d = dayOf(p); const n = d ? stopNo(d,p) : 0;
  const pr = p.priority==='MUST SEE' ? `<span class="tag must">ОБЯЗАТЕЛЬНО</span>` : `<span class="tag opt">ПО ЖЕЛАНИЮ</span>`;
  const isFuel = p.type==='FUEL';
  return `
  <div class="ph"><span class="num ${kind(p)}">${n||kindIcon(p)||'•'}</span><h3>${esc(p.name)}</h3></div>
  <div style="margin:4px 0 6px">${pr}<span class="tag">${TN[p.type]||esc(p.type)}</span>${p.weatherDependent?`<span class="tag wx">ПОГОДА</span>`:''}${d?`<span class="tag">${d.label} · остановка ${n||'—'}</span>`:''}</div>
  ${isDropped(p) ? `<div class="warn red">ПЛОХАЯ ПОГОДА: эта остановка зависит от погоды — см. «Пропустить если».</div>`:''}
  <p class="why">${esc(p.description)}</p>
  ${aboutBlock(p)}
  <div class="kv">
    <b>Что делаем</b><div>${esc(p.whatToDo)}</div>
    <b>Время</b><div>${esc(p.duration)}</div>
    <b>Парковка</b><div>${esc(p.parking)}</div>
    <b>Билет</b><div>${esc(p.ticket)}</div>
    <b>Часы</b><div>${esc(p.openingHours)}</div>
    <b>Бронь</b><div>${esc(p.booking)}</div>
    <b>Пропустить если</b><div>${esc(p.skipIf)}</div>
  </div>
  <div class="row">
    <a class="btn go" href="${gmNav(p)}" target="_blank" rel="noopener">▶ ЕХАТЬ — навигация сюда</a>
    ${isFuel?`<a class="btn" href="${gmFuel(p)}" target="_blank" rel="noopener">⛽ АЗС рядом</a>`:`<a class="btn" href="${gmPlace(p)}" target="_blank" rel="noopener">Google Maps</a>`}
    ${p.officialUrl?`<a class="btn" href="${esc(p.officialUrl)}" target="_blank" rel="noopener">Официальный сайт</a>`:''}
    ${opts.showDay && d ? `<button class="btn" onclick="showDay('${d.id}')">План дня ${d.label}</button>`:''}
    ${(DATA.tickets||[]).filter(t=>t.poi===p.id).map(t=>`<span class="btn tixbtn" style="pointer-events:none">🎫 ${t.status==='bought'?'куплено':'нужен билет'} · ${esc(t.where||'')}</span>`).join('')}
  </div>`;
}
/* short popup for map */
function poiPopup(p){
  const d = dayOf(p); const n = d ? stopNo(d,p) : 0;
  const why = p.description.length>170 ? p.description.slice(0,168).replace(/\s\S*$/,'')+'…' : p.description;
  return `<div class="pop"><div class="ph"><span class="num ${kind(p)}">${n||kindIcon(p)||'•'}</span><b>${esc(p.name)}</b></div>
    <div class="pm">${d?d.label+' · ':''}${TN[p.type]||esc(p.type)} · ${esc(p.duration)}${p.weatherDependent?' · ☂':''}</div>
    <div class="pw">${esc(why)}</div>
    <div class="pa"><a class="btn sm go" href="${gmNav(p)}" target="_blank" rel="noopener">▶ GO</a><button class="btn sm" onclick="openPoi('${p.id}')">Подробнее</button></div></div>`;
}

/* ===================== MAP ===================== */
let map=null, gRoutes, gPois, routeLines={}, markerIndex={}, mapDay='ALL', poiFilter='ALL';
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:false }).setView([52.0, 9.5], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  L.control.zoom({ position:'topright' }).addTo(map); map.on('popupopen',()=>{});
  gRoutes = L.layerGroup().addTo(map); gPois = L.layerGroup().addTo(map);
  buildDaystrip(); buildMapbar(); drawRoutes(); renderMapDay();
  setTimeout(()=>map.invalidateSize(), 50);
}
function buildDaystrip(){
  $('#daystrip').innerHTML = `<button class="${mapDay==='ALL'?'on':''}" onclick="setMapDay('ALL')">ВСЁ<small>весь путь</small></button>` +
    DATA.days.map(d=>`<button class="${mapDay===d.id?'on':''}" style="--c:${DATA.countries[d.country].color}" onclick="setMapDay('${d.id}')">${d.label.split(' ')[0]}<small>${DN[d.dow]}</small></button>`).join('');
  const on=$('#daystrip button.on'); if(on){ const ds=$('#daystrip'); ds.scrollLeft = on.offsetLeft - ds.clientWidth/2 + on.offsetWidth/2; }
}
function buildMapbar(){
  const f=[['ALL','ВСЕ'],['MUST SEE','ОБЯЗАТЕЛЬНО'],['OPTIONAL','ПО ЖЕЛАНИЮ'],['HOTELS','ОТЕЛИ'],['FUEL','ЗАПРАВКИ']];
  $('#mapbar').innerHTML = f.map(([x,n])=>`<button class="${x===poiFilter?'on':''}" onclick="poiFilter='${x}';buildMapbar();renderMapDay()">${n}</button>`).join('');
}
function setMapDay(id){ mapDay=id; buildDaystrip(); renderMapDay(true); }
function drawRoutes(){
  DATA.days.forEach(d=>{
    if(d.via&&d.via.length>=2){
      let pts=d.via; try{ const c=localStorage.getItem('geom:'+d.id); if(c) pts=JSON.parse(c); }catch(e){}
      const line=L.polyline(pts,{color:DATA.countries[d.country].color,weight:5,opacity:.9,lineJoin:'round'});
      line.on('click',()=>{ setMapDay(d.id); openSheet(routeCard(d)); });
      routeLines[d.id]=line; gRoutes.addLayer(line);
      let cached=false; try{cached=!!localStorage.getItem('geom:'+d.id)}catch(e){}
      if(!cached && d.km>0) fetchOSRM(d);
    }
    if(d.train){ const t=L.polyline(d.train,{color:'#374151',weight:3,dashArray:'2 6',opacity:.9}); t.bindTooltip('🚆 Поезд BUD → Wien Hbf',{sticky:true}); routeLines[d.id+'_train']=t; gRoutes.addLayer(t); }
  });
  const fl=[{p:[[47.4647,8.5492],[52.31,4.76],[60.2934,5.2181]],n:'✈ 20 Sep ZRH → AMS → BGO 13:35 (KLM)'},{p:[[60.2934,5.2181],[47.4369,19.2556]],n:'✈ 23 Sep BGO → BUD 14:40 → DXB 22:40'}];
  fl.forEach((f,i)=>{ const l=L.polyline(f.p,{color:'#6B7280',weight:2,dashArray:'6 8',opacity:.8}); l.bindTooltip(f.n,{sticky:true}); routeLines['fl'+i]=l; gRoutes.addLayer(l); });
}
async function fetchOSRM(d){
  try{
    const pts = d.via.length>25 ? d.via.filter((_,i)=> i%Math.ceil(d.via.length/25)===0 || i===d.via.length-1) : d.via;
    const coords = pts.map(p=>`${p[1]},${p[0]}`).join(';');
    const ctrl=new AbortController(); setTimeout(()=>ctrl.abort(),9000);
    const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${coords}?overview=simplified&geometries=geojson`,{signal:ctrl.signal});
    if(!r.ok) return; const j=await r.json(); const g=j.routes?.[0]?.geometry?.coordinates; if(!g) return;
    const ll2=g.map(c=>[+c[1].toFixed(5),+c[0].toFixed(5)]); routeLines[d.id].setLatLngs(ll2);
    try{ localStorage.setItem('geom:'+d.id, JSON.stringify(ll2)); }catch(e){}
  }catch(e){}
}
function renderMapDay(fit){
  if(!map) return;
  gPois.clearLayers(); markerIndex={};
  const all = mapDay==='ALL'; const d = all?null:DAY[mapDay];
  // route emphasis
  Object.entries(routeLines).forEach(([k,l])=>{ const isFl=k.startsWith('fl'); const mine = all || k===mapDay || k===mapDay+'_train'; l.setStyle({opacity: mine? (isFl?.8:.95):.18, weight: mine? (isFl?2:6): 3}); if(mine) l.bringToFront(); });
  if(all){
    // overview: nights numbered by day, airports & car points, others as small dots
    const nights={}; DATA.days.forEach(d=>{ const h=POI[d.sleep]; if(!h) return; (nights[h.id]=nights[h.id]||{h,days:[],c:DATA.countries[d.country].color}).days.push(d.label.split(' ')[0]); });
    Object.values(nights).forEach(n=>addMarker(n.h, `<div class="mk night" style="--c:${n.c}"><b>${n.days.length>1?n.days[0]+'–'+n.days[n.days.length-1]:n.days[0]}</b><small>${esc(short(n.h.name))}</small></div>`, [0,0], 'night'));
    DATA.pois.filter(p=>['AIRPORT','CAR RENTAL'].includes(p.type)).forEach(p=>addMarker(p, `<div class="mk big ${kind(p)}"><span>${kindIcon(p)}</span><small>${esc(p.type==='CAR RENTAL'?(p.name.startsWith('PICK')?'PICK UP':'RETURN'):'')}</small></div>`, [0,0], 'big'));
    DATA.pois.filter(p=>!['AIRPORT','CAR RENTAL','HOTEL','FUEL'].includes(p.type) && p.priority==='MUST SEE').forEach(p=>addMarker(p, `<div class="mk dot" style="background:${DATA.countries[p.country].color}"></div>`, [0,0], 'dot'));
    $('#daypanel').innerHTML = overviewPanel();
    if(fit!==false) map.fitBounds(L.latLngBounds(DATA.pois.map(p=>[p.lat,p.lng])),{paddingTopLeft:[10,100],paddingBottomRight:[10,230]});
  } else {
    const stops = dayStops(d);
    stops.forEach((p,i)=>{
      if(poiFilter==='MUST SEE'&&p.priority!=='MUST SEE'&&p.type!=='HOTEL') return;
      if(poiFilter==='OPTIONAL'&&p.priority!=='OPTIONAL') return;
      if(poiFilter==='HOTELS'&&p.type!=='HOTEL') return;
      if(poiFilter==='FUEL'&&p.type!=='FUEL') return;
      const dropped=isDropped(p);
      addMarker(p, `<div class="mk num ${kind(p)} ${dropped?'drop':''}">${['HOTEL','AIRPORT','CAR RENTAL','FUEL','PARKING'].includes(p.type)?kindIcon(p):(i+1)}</div>`, [0,0], 'num');
    });
    $('#daypanel').innerHTML = dayPanel(d);
    if(fit!==false){ const b=L.latLngBounds(stops.map(p=>[p.lat,p.lng])); if(d.via) d.via.forEach(v=>b.extend(v)); map.fitBounds(b,{paddingTopLeft:[20,100],paddingBottomRight:[20,210]}); }
  }
}
function addMarker(p, html, anchor, cls){
  const size = cls==='night'?[90,30]: cls==='big'?[64,34]: cls==='dot'?[10,10]:[30,30];
  const icon=L.divIcon({className:'', html, iconSize:size, iconAnchor:[size[0]/2,size[1]/2]});
  const m=L.marker([p.lat,p.lng],{icon, zIndexOffset: cls==='dot'?0:500}).bindPopup(poiPopup(p),{maxWidth:300, closeButton:false, offset:[0,-10]});
  markerIndex[p.id]=m; gPois.addLayer(m);
}

  h+=stayBlock(d);
  h+=segButtons(d);
  $('#today').innerHTML=h;
}

/* ===================== BOOKINGS ===================== */
let bookFilter='ALL';
function renderBook(){
  const cats=['ALL','FLIGHT','HOTEL','CAR','BOAT','CABLE CAR','ATTRACTION','TOLL/VIGNETTE']; const CN={ALL:'ВСЕ',FLIGHT:'РЕЙСЫ',HOTEL:'ОТЕЛИ',CAR:'МАШИНЫ',BOAT:'ЛОДКИ','CABLE CAR':'КАНАТКИ',ATTRACTION:'БИЛЕТЫ','TOLL/VIGNETTE':'ВИНЬЕТКИ'};
  const STN={'BOOK NOW':'БРОНИРОВАТЬ СЕЙЧАС','BOOK LATER':'ПОЗЖЕ','WEATHER DEPENDENT':'ПО ПОГОДЕ','NO BOOKING':'БЕЗ БРОНИ'}; const stc=s=>({'BOOK NOW':'now','BOOK LATER':'later','WEATHER DEPENDENT':'wx','NO BOOKING':'no'}[s]||'no');
  const rows=DATA.bookings.filter(b=>bookFilter==='ALL'||b.cat===bookFilter).map(b=>`<tr><td>${esc(b.date)}</td><td>${esc(b.item)}<br><span class="muted">${CN[b.cat]||b.cat} · когда: ${esc(b.bookBy)}</span></td><td>${esc(b.price)}</td><td><span class="st ${stc(b.status)}">${STN[b.status]||esc(b.status)}</span></td><td>${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">↗</a>`:''}</td></tr>`).join('');
  const T=DATA.tickets||[];
  const tix=`<div class="card tix"><div class="story-h" style="margin-top:0">🎫 БИЛЕТЫ И ПОСАДОЧНЫЕ</div>
    <div class="tixlist">${T.map(t=>`<div class="tixrow"><span class="tixd">${esc(t.date)}</span><span class="tixt"><b>${esc(t.title)}</b><small>${esc(t.where||'')}${t.note?' · '+esc(t.note):''}</small></span><span class="tixo">${t.status==='bought'?'✅':'⬜'}</span></div>`).join('')}</div>
    <div class="muted" style="margin-top:6px">${esc(DATA.ticketsNote||'')}</div></div>`;
  $('#book').innerHTML=tix+`<div class="filt">${cats.map(c=>`<button class="${c===bookFilter?'on':''}" onclick="bookFilter='${c}';renderBook()">${CN[c]}</button>`).join('')}</div>
  <div class="card" style="padding:0;overflow:auto"><table><thead><tr><th>Дата</th><th>Что</th><th>Цена</th><th>Статус</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <h3>ОЦЕНКА ТРАНСПОРТНЫХ РАСХОДОВ</h3>
  <div class="card" style="padding:0"><table><tbody>${DATA.costs.map(c=>`<tr><td>${esc(c.item)}</td><td style="text-align:right;white-space:nowrap"><b>${esc(c.est)}</b></td></tr>`).join('')}</tbody></table></div>
  <div class="muted">Оценки на ${DATA.trip.checkedAt}. Всё «требует проверки» уточняется при бронировании. <a href="#" onclick="switchView('src');return false">✓ Источники</a></div>`;
}

/* ===================== FLIGHTS ===================== */
