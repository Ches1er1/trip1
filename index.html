    <div class="hdr">${esc(f.route)} <small>${esc(f.date)} · ${esc(f.airline)} ${esc(f.number)}</small></div>
    <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${esc(f.dep)}</b><span>вылет</span></div><div><b>${esc(f.arr)}</b><span>прилёт</span></div><div><b>${esc(f.duration)}</b><span>${esc(f.type)}</span></div></div>
    <div class="kv"><b>Ручная кладь</b><div>${esc(f.baggage)}</div><b>Цена с чемоданом</b><div>${esc(f.fare)}</div><b>На двоих</b><div>${esc(f.total2)}</div><b>Где купить</b><div>${esc(f.source)}</div><b>Риск</b><div><span class="tag ${/НИЗ/.test(f.risk)?'ok':'bad'}">${esc(f.risk)}</span></div><b>Почему</b><div>${esc(f.why)}</div><b>Альтернатива</b><div>${esc(f.alt)}</div></div></div>`).join('')+
  `<div class="warn">Все билеты — отдельные брони. Единственная стыковка «билет-к-билету» — 23 Sep в BUD: 5 часов между Wizz (17:25) и flydubai (22:40), оба T2B, багаж только ручной.</div>`;
}

/* ===================== CARS ===================== */
function renderCars(){
  $('#cars').innerHTML=`<div class="card"><b>ГДЕ ПОЛУЧАЕМ И СДАЁМ МАШИНЫ</b>
    <div class="gl"><span class="gt">МАШИНА #1</span><span><b>ПОЛУЧЕНИЕ</b> 10 Sep 08:00 · Wien Hauptbahnhof, стойки внутри вокзала<br><b>СДАЧА</b> 19 Sep 19:20 · аэропорт Цюриха, возврат прокатных машин<br>10 дней · AT/CZ/DE/LI/CH · ~2 000 км</span></div>
    <div class="gl"><span class="gt">МАШИНА #2</span><span><b>ПОЛУЧЕНИЕ</b> 20 Sep 14:00 · аэропорт Берген Flesland, стойки в терминале<br><b>СДАЧА</b> 23 Sep до 12:30 · там же<br>2 дня · ~630 км · гибрид/бензин, НЕ электро</span></div>
    ${['d10','d19','d20','d23'].map(id=>`<details class="prac"><summary>${DAY[id].label} · ${esc(DAY[id].car||'')}</summary>${legsBlock(DAY[id])}${logisticsBlock(DAY[id])}</details>`).join('')}
    <div class="row"><a class="btn sm" href="${gmNav(POI.vienna_pickup)}" target="_blank" rel="noopener">▶ Wien Hbf</a><a class="btn sm" href="${gmNav(POI.zrh_return)}" target="_blank" rel="noopener">▶ Сдача ZRH</a><a class="btn sm" href="${gmNav(POI.bgo_airport)}" target="_blank" rel="noopener">▶ BGO</a></div></div>`+
  DATA.cars.map(c=>`<div class="card"><h3 style="margin-top:0">${esc(c.title)}</h3>
    ${c.scenarios.map(s=>`<div class="scn"><b class="n">${esc(s.name)}</b><div class="kv" style="grid-template-columns:70px 1fr"><b>Плюсы</b><div>${esc(s.pros)}</div><b>Минусы</b><div>${esc(s.cons)}</div><b>Итого</b><div><b>${esc(s.est)}</b></div><b>Статус</b><div><span class="tag must">${esc(s.status)}</span></div></div></div>`).join('')}
    <h3>Чек-лист при бронировании</h3><ul style="padding-left:18px;margin:0">${c.checklist.map(x=>`<li style="margin:4px 0;font-size:14px">${esc(x)}</li>`).join('')}</ul>
    <div class="warn blue" style="margin-top:10px"><b>Рекомендация:</b> ${esc(c.recommendation)}</div></div>`).join('');
}

/* ===================== BUDGET ===================== */
function usd(a,c){ const r=(DATA.budget&&DATA.budget.rates&&DATA.budget.rates[c])||1; return a*r; }
function fmtUSD(n){ return '$'+Math.round(n).toLocaleString('en-US'); }
function fmtCur(a,c){ return (c==='USD'?'$':'')+a.toLocaleString('en-US')+(c==='USD'?'':' '+c); }
function renderBudget(){
  const B=DATA.budget; if(!B){ $('#budget').innerHTML='—'; return; }
  const cats=[...new Set(B.spent.map(x=>x.cat))];
  let spentTotal=0, unknown=0;
  const spentRows=B.spent.map(x=>{ const v=x.amount==null?null:usd(x.amount,x.cur); if(v!=null) spentTotal+=v; else unknown++; return `<tr><td>${esc(x.item)}<br><span class="muted">${esc(x.note||'')}</span></td><td style="text-align:right;white-space:nowrap">${x.amount==null?'<b class="bad">?</b>':`<b>${fmtUSD(v)}</b><br><span class="muted">${fmtCur(x.amount,x.cur)}</span>`}</td></tr>`; }).join('');
  let pMin=0,pMax=0; const pcats={};
  B.planned.forEach(x=>{ const a=usd(x.min,x.cur), b=usd(x.max,x.cur); pMin+=a; pMax+=b; (pcats[x.cat]=pcats[x.cat]||{min:0,max:0,rows:[]}); pcats[x.cat].min+=a; pcats[x.cat].max+=b; pcats[x.cat].rows.push(`<tr><td>${esc(x.item)}</td><td style="text-align:right;white-space:nowrap">${a===b?fmtUSD(a):fmtUSD(a)+'–'+fmtUSD(b)}</td></tr>`); });
  const catSpent={}; B.spent.forEach(x=>{ if(x.amount!=null){ catSpent[x.cat]=(catSpent[x.cat]||0)+usd(x.amount,x.cur);} });
  $('#budget').innerHTML=`
  <div class="card" style="padding:12px">
    <div class="stats" style="grid-template-columns:repeat(3,1fr)"><div><b>${fmtUSD(spentTotal)}</b><span>уже потрачено</span></div><div><b>${fmtUSD(pMin)}–${fmtUSD(pMax)}</b><span>ещё предстоит</span></div><div><b>${fmtUSD(spentTotal+pMin)}–${fmtUSD(spentTotal+pMax)}</b><span>итого поездка</span></div></div>
    ${unknown?`<div class="warn">${unknown} позиции без суммы (Pegasus, Wizz, RAV4) — пришлите цены, добавлю к факту.</div>`:''}
    <div class="muted" style="margin-top:6px">${esc(B.note)}</div>
  </div>
  <h3>Потрачено по категориям</h3>
  <div class="card" style="padding:0"><table><tbody>${cats.map(c=>`<tr><td><b>${esc(c)}</b></td><td style="text-align:right"><b>${fmtUSD(catSpent[c]||0)}</b></td></tr>`).join('')}</tbody></table></div>
  <h3>Куплено и забронировано</h3>
  <div class="card" style="padding:0;overflow:auto"><table><tbody>${spentRows}</tbody></table></div>
  <h3>Прогноз остатка</h3>
  ${Object.entries(pcats).map(([c,v])=>`<details class="prac"><summary>${esc(c)} — ${fmtUSD(v.min)}–${fmtUSD(v.max)}</summary><div class="card" style="padding:0;margin-top:6px"><table><tbody>${v.rows.join('')}</tbody></table></div></details>`).join('')}
  <div class="muted" style="margin-top:10px">Еда посчитана как ресторан вечером + обед + кофе; с кухней в Праге/Инсбруке/Аурланде можно срезать 20–30%.</div>`;
}

/* ===================== SOURCES ===================== */
function renderSrc(){
  $('#src').innerHTML=`<div class="muted" style="margin-bottom:8px">Проверено ${DATA.trip.checkedAt}. Всё с пометкой ПРОВЕРИТЬ — перепроверять накануне.</div>`+
  DATA.sources.map(s=>`<div class="card" style="padding:10px 12px"><div><b>${esc(s.fact)}</b></div><div class="muted">${esc(s.source)} · проверено ${esc(s.checked)}</div><div style="margin-top:4px"><span class="tag ${/НЕ ПРОВ|ЗАПРОС|ПРИМЕРНО/.test(s.status)?'bad':(/ПРОВЕРИТЬ/.test(s.status)?'wx':'ok')}">${esc(s.status)}</span> ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">источник ↗</a>`:''}</div></div>`).join('');
}

/* ===================== NAV / INIT ===================== */
function switchView(v){
  $$('.view').forEach(x=>x.classList.toggle('on', x.id==='view-'+v));
  $$('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  if(v==='map'){ if(map) setTimeout(()=>map.invalidateSize(),60); } closeSheet();
}
$$('nav.tabs button').forEach(b=>b.addEventListener('click',()=>switchView(b.dataset.v)));
(function init(){
  $('#hdr-dates').textContent=DATA.trip.dates; $('#hdr-title').textContent=DATA.trip.title;
  try{ const w=localStorage.getItem('wx'); if(w) WX=w; }catch(e){}
  $('#wx-good').classList.toggle('on',WX==='good'); $('#wx-bad').classList.toggle('on',WX==='bad');
  const iso=new Date().toISOString().slice(0,10);
  let t=DATA.days.find(d=>d.date===iso)?.id; try{ if(!t) t=localStorage.getItem('today'); }catch(e){}
  todayId=(t&&DAY[t])?t:DATA.days[0].id;
  if(DATA.days.find(d=>d.date===iso)) mapDay=todayId;
  renderItin(); buildTodayPick(); renderToday(); renderBook(); renderFly(); renderCars(); renderBudget(); renderSrc();
  try{ initMap(); }catch(e){ console.error(e); $('#map').innerHTML='<div class="pad"><div class="warn red">Map failed to load. All other tabs work.</div></div>'; }
})();
</script>
